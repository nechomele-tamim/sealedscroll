<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body><title>The Sealed Scroll</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Frank+Ruhl+Libre:wght@500;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
/* Layout: a sealed-scroll header with six wax seals, a row of chamber stones, one stone-tablet stage. #control = the class big screen. */
:root{
  --bg:#E6E3DB; --panel:#F7F5F0; --panel-2:#EFECE4; --ink:#1C2333; --muted:#596072; --line:#CEC8BA;
  --lapis:#2B4C8C; --lapis-soft:#DDE5F3; --on-accent:#FFFFFF;
  --gold:#9C6B10; --gold-soft:#F2E5C6; --flame:#E39A2B;
  --ok:#2E6A3E; --ok-soft:#DCEBDD; --warn:#9A3A2A; --warn-soft:#F5DFD9;
  --sea:#C9D6E6; --land:#E2D9C4; --land-2:#D6CBB0; --night:#151B2A; --night-2:#232C40; --stone:#B9AF9A; --stone-2:#9C927C;
  --s0:#2B4C8C; --s1:#5A6A1F; --s2:#9B2D3A; --s3:#9C6B10;
  --display:'Marcellus', Georgia, 'Times New Roman', serif;
  --body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --heb:'Frank Ruhl Libre', 'Times New Roman', serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10151E; --panel:#19202E; --panel-2:#212A3B; --ink:#ECE8DF; --muted:#A4AABA; --line:#313B4E;
  --lapis:#8EAEF0; --lapis-soft:#22304D; --on-accent:#0F131B;
  --gold:#E3B252; --gold-soft:#3A2F17; --flame:#F2B04A;
  --ok:#82C894; --ok-soft:#1C3324; --warn:#F09C88; --warn-soft:#3E231E;
  --sea:#1F3550; --land:#3A3426; --land-2:#4A4230; --night:#0A0E16; --night-2:#1A2233; --stone:#4C4638; --stone-2:#3A3529;
  --s0:#7B9DE6; --s1:#A9B85A; --s2:#E27583; --s3:#E3B252;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#10151E; --panel:#19202E; --panel-2:#212A3B; --ink:#ECE8DF; --muted:#A4AABA; --line:#313B4E;
  --lapis:#8EAEF0; --lapis-soft:#22304D; --on-accent:#0F131B;
  --gold:#E3B252; --gold-soft:#3A2F17; --flame:#F2B04A;
  --ok:#82C894; --ok-soft:#1C3324; --warn:#F09C88; --warn-soft:#3E231E;
  --sea:#1F3550; --land:#3A3426; --land-2:#4A4230; --night:#0A0E16; --night-2:#1A2233; --stone:#4C4638; --stone-2:#3A3529;
  --s0:#7B9DE6; --s1:#A9B85A; --s2:#E27583; --s3:#E3B252;
  color-scheme:dark; }

*{box-sizing:border-box}
html{font-size:18px}
html.big{font-size:clamp(18px,1.3vw,30px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 40px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wrap.wide{max-width:1400px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-size:1.5rem;letter-spacing:.04em;margin:0;font-weight:400}
.brand small{display:block;font-family:var(--body);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seals{display:flex;gap:6px;align-items:center}
.wax{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:.85rem;border:2px solid var(--line);color:var(--muted);background:var(--panel)}
.wax.active{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.wax.open{background:var(--gold);border-color:var(--gold);color:var(--on-accent)}
.tools{display:flex;gap:8px}
.chip-btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:.9rem;cursor:pointer;min-height:44px}

.track{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stone{background:var(--panel-2);border-radius:8px;padding:6px 8px;font-size:.78rem;color:var(--muted);text-align:center;border:1px solid transparent;min-width:0}
.stone b{display:block;font-family:var(--display);font-size:.95rem;font-weight:400}
.stone.now{border-color:var(--lapis);color:var(--ink);background:var(--lapis-soft)}
.stone.done{color:var(--ok)}
@media (max-width:560px){ .stone span{display:none} }

.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,4vw,32px);display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0}
h2{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,4.5vw,2.2rem);line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0}
p{margin:0}
.lead{font-size:1.08rem;max-width:62ch}
.muted{color:var(--muted)}
.driver{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}

.btn{border:none;border-radius:12px;padding:12px 20px;min-height:52px;font-weight:700;cursor:pointer;background:var(--lapis);color:var(--on-accent);font-size:1.02rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--on-accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* room-action banner: something to do away from the tablet */
.action{border:2px solid var(--gold);background:var(--gold-soft);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.action svg{flex:none;width:46px;height:46px}
.action h4{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:1.25rem}
.action ol,.action ul{margin:6px 0 0;padding-left:1.2em}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.sealed{background:var(--panel-2);cursor:pointer;align-items:flex-start;text-align:left;min-height:120px;justify-content:center;border-style:dashed}
.card .for{font-size:.82rem;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card h4{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0}
.card .yr{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}
.aloud-tag{font-size:.78rem;font-weight:700;color:var(--s2);text-transform:uppercase;letter-spacing:.08em}
.say-btn{align-self:flex-start;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;min-height:40px}
.he{direction:rtl;font-family:var(--heb);font-size:1.6rem;line-height:1.9;display:flex;flex-wrap:wrap;gap:4px 8px}
.he button{font-family:var(--heb);font-size:1.6rem;border:none;background:var(--gold-soft);border-radius:8px;padding:0 8px;cursor:pointer}
.gloss{font-size:.95rem;color:var(--gold);min-height:1.5em}

.ritual{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.sealrow{display:flex;flex-wrap:wrap;gap:14px}
.seal{display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;cursor:pointer;min-width:72px}
.seal i{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:1.5rem;border:3px dashed currentColor}
.seal.on i{background:currentColor}
.seal.on i span{color:var(--on-accent)}
.seal small{font-size:.85rem;color:var(--ink)}

.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;min-height:52px}
.slot .n{font-family:var(--display);color:var(--gold);width:1.5em;flex:none}
.tile{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;min-height:48px;font-size:1rem}
.tile.sel{border:2px solid var(--lapis);background:var(--lapis-soft)}
.slot .tile{flex:1;background:var(--lapis-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.feedback{border-radius:10px;padding:12px 14px;font-weight:700}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.no{background:var(--warn-soft);color:var(--warn)}
.feedback.info{background:var(--gold-soft);color:var(--ink);font-weight:400}
.hintbox{background:var(--panel-2);border-radius:10px;padding:10px 14px;font-size:.98rem}

.lock{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.dial{font-family:var(--display);font-size:2.4rem;letter-spacing:.2em;font-variant-numeric:tabular-nums;border:2px solid var(--gold);border-radius:12px;padding:4px 18px;min-width:5ch;text-align:center;min-height:68px}
.pad{display:grid;grid-template-columns:repeat(5,56px);gap:8px}
.pad button{height:56px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-size:1.3rem;cursor:pointer}
.part{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}

.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel-2);cursor:pointer;min-height:52px;font-size:1rem}
.choice.picked{border:2px solid var(--lapis)}

.bins{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bin{border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0;padding:0}
.bin svg{width:100%;height:auto;display:block}
.bin .inbook{display:flex;flex-direction:column;gap:6px;padding:0 4px}
.bin.armed svg .cover{stroke:var(--lapis);stroke-width:4}
.bins.plain{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.pbin{border:2px dashed var(--line);border-radius:12px;padding:12px;min-height:130px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:transparent;text-align:left;min-width:0}
.pbin h4{margin:0;font-family:var(--display);font-weight:400;font-size:1.2rem}
.pbin h4.hb{font-family:var(--heb);font-size:1.7rem;direction:rtl;text-align:right;font-weight:500}
.card.wide{grid-column:1/-1}
.pbin small{color:var(--muted);font-size:.85rem;margin-top:-6px}
.pbin.armed{border-color:var(--lapis);background:var(--lapis-soft)}
@media (max-width:520px){ .bins{grid-template-columns:1fr} }

.mapbox{overflow-x:auto}
.mapbox svg{width:100%;max-width:640px;height:auto;max-height:58vh;display:block}
.region{fill:var(--land-2);stroke:var(--panel);stroke-width:3;cursor:pointer}
.region.tagged{fill:var(--gold-soft);stroke:var(--gold)}
.maptext{fill:var(--ink);font-family:var(--body);font-size:13px;pointer-events:none;font-weight:700}
.seatext{fill:var(--muted);font-family:var(--body);font-size:13px;font-style:italic;pointer-events:none}

.letters{direction:rtl;display:flex;gap:10px;flex-wrap:wrap}
.letters span{width:56px;height:64px;border:2px solid var(--gold);border-radius:10px;display:grid;place-items:center;font-family:var(--heb);font-size:2.2rem;color:var(--gold)}
.letterpad{direction:rtl;display:flex;gap:10px;flex-wrap:wrap}
.letterpad button{width:64px;height:64px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-family:var(--heb);font-size:2rem;cursor:pointer}

.script{display:flex;flex-direction:column;gap:10px}
.line{border-left:4px solid var(--line);padding:6px 12px}
.line.speak{border-color:var(--s2)}
.line .who{font-weight:700;font-size:.9rem;display:flex;gap:6px;align-items:center}
.line.stage{font-style:italic;color:var(--muted);border-color:transparent}

.codeword{font-family:var(--display);font-size:clamp(2.2rem,8vw,3.4rem);letter-spacing:.12em;color:var(--gold);border:2px dashed var(--gold);border-radius:14px;padding:6px 20px;align-self:flex-start}
.flip{border:1px solid var(--line);border-radius:12px;padding:16px;min-height:90px;background:var(--panel-2);cursor:pointer;text-align:left;width:100%}
.flip b{display:block;margin-bottom:4px}

.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.role{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field textarea,.field select{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);min-height:50px;width:100%}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}

.overlay{position:fixed;inset:0;background:rgba(10,14,22,.72);display:grid;place-items:center;z-index:50;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet{background:var(--panel);color:var(--ink);border-radius:16px;padding:22px;max-width:640px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.freeze h2{font-size:clamp(2rem,7vw,3.2rem);text-align:center}
.keyrow{display:flex;gap:8px;flex-wrap:wrap}
.keyrow input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);width:9ch}
.tkey{background:var(--panel-2);border-radius:10px;padding:12px;font-size:.98rem}
.tkey b{color:var(--gold)}
.foot{display:flex;justify-content:flex-end}
.cb-tabs{display:flex;gap:8px;flex-wrap:wrap}
.cb-ch{font-family:var(--display);font-size:1.15rem;margin:10px 0 0;color:var(--gold)}
.cb-card{border-left:4px solid var(--gold);background:var(--panel-2);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.cb-card h4{margin:0;font-family:var(--display);font-weight:400;font-size:1.1rem}
.cb-card .src{font-size:.85rem;color:var(--muted)}
.foot button{background:none;border:none;color:var(--muted);font-size:.85rem;cursor:pointer;padding:8px;min-height:44px}

/* ===== scenes (transitions + big-screen animations) ===== */
.scene{position:fixed;inset:0;z-index:60;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.scene svg{width:min(92vw,720px);height:auto;max-height:68vh}
.scene .cap{font-family:var(--display);color:#F2E5C6;font-size:clamp(1.4rem,4vw,2.2rem);text-align:center;text-wrap:balance;max-width:28ch}
.scene .skip{color:#A4AABA;font-size:.85rem}
.ink-gold{fill:#E3B252}.ink-gold-s{stroke:#E3B252}
@keyframes leafL{to{transform:perspective(600px) rotateY(-80deg)}}
@keyframes leafR{to{transform:perspective(600px) rotateY(80deg)}}
@keyframes rise{to{transform:translateY(-150px)}}
@keyframes shackle{0%{transform:translateY(0)}50%{transform:translateY(-22px)}100%{transform:translateY(-22px) rotate(-35deg)}}
@keyframes sun{from{transform:translateY(90px)}to{transform:translateY(0)}}
@keyframes skyfade{from{opacity:.2}to{opacity:1}}
@keyframes splitL{to{transform:translateX(-90px) rotate(-8deg)}}
@keyframes splitR{to{transform:translateX(90px) rotate(8deg)}}
@keyframes crackL{to{transform:translate(-60px,30px) rotate(-30deg);opacity:0}}
@keyframes crackR{to{transform:translate(60px,30px) rotate(30deg);opacity:0}}
@keyframes unroll{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px #E3B252)}50%{filter:drop-shadow(0 0 22px #F2B04A)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes flicker{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.15)}}
@keyframes walk{from{transform:translateX(0)}to{transform:translateX(330px)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fill{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.a-leafL{transform-box:fill-box;transform-origin:left center;animation:leafL 1.6s .3s ease-in-out forwards}
.a-leafR{transform-box:fill-box;transform-origin:right center;animation:leafR 1.6s .3s ease-in-out forwards}
.a-rise{animation:rise 1.8s .3s ease-in-out forwards}
.a-shackle{transform-box:fill-box;transform-origin:right bottom;animation:shackle 1.6s .3s ease-out forwards}
.a-sun{animation:sun 2s ease-out forwards}
.a-sky{animation:skyfade 2s ease-out forwards}
.a-splitL{transform-box:fill-box;transform-origin:center;animation:splitL 1.6s .4s ease-in-out forwards}
.a-splitR{transform-box:fill-box;transform-origin:center;animation:splitR 1.6s .4s ease-in-out forwards}
.a-crackL{transform-box:fill-box;transform-origin:center;animation:crackL 1.4s .5s ease-in forwards}
.a-crackR{transform-box:fill-box;transform-origin:center;animation:crackR 1.4s .5s ease-in forwards}
.a-unroll{transform-box:fill-box;transform-origin:center;animation:unroll 1.6s ease-out forwards}
.a-glow{animation:glow 1.4s ease-in-out infinite}
.a-pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .6s ease-out forwards}
.a-flicker{transform-box:fill-box;transform-origin:bottom center;animation:flicker .5s ease-in-out infinite}
.a-walk{animation:walk 5s linear forwards}
.a-fade{opacity:0;animation:fadein .8s ease-out forwards}
.a-fill{transform-box:fill-box;transform-origin:bottom;animation:fill 2s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}

/* ===== Mission Control (big screen) ===== */
.mc{font-size:1.1rem}
.mc .btn{font-size:1.1rem;min-height:3rem}
.mc .lamp svg{width:3rem;height:2.3rem}
.mc .lamp{font-size:.8rem}
.mc-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.mc-head h1{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,3vw,2.6rem);margin:0}
.mc-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){ .mc-grid{grid-template-columns:1fr} }
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grp{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(var(--lamps,5),minmax(0,1fr));gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:none}
.grp .gname{font-weight:700;font-size:1.15rem;overflow-wrap:anywhere}
.lamp{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted)}
.lamp svg{width:44px;height:34px}
.lamp.lit{color:var(--ink)}
.jar svg{width:100%;max-width:220px;height:auto;display:block;margin:0 auto}
.bigbtns{display:flex;flex-wrap:wrap;gap:10px}
.toast{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top, 0px));transform:translateX(-50%);background:var(--gold);color:var(--on-accent);padding:14px 24px;border-radius:14px;font-weight:700;font-size:1.3rem;z-index:70;animation:pop .5s ease-out forwards;max-width:calc(100vw - 32px)}
.show{position:fixed;inset:0;z-index:55;background:var(--night);color:#ECE8DF;display:flex;flex-direction:column;
  padding:max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px))}

function bigArt(name, arg, arg2){ const a = ART[name]; return a ? a(arg, arg2) : ""; }

/* Short transition scene on a tablet. Plays, then calls cb. Tap to skip. */
function playScene(name, caption, cb, arg){
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const el = document.createElement("div");
  el.className = "scene"; el.setAttribute("role","dialog"); el.setAttribute("aria-label", caption);
  el.innerHTML = `${ART[name](arg)}<p class="cap">${esc(caption)}</p><p class="skip">Tap to continue</p>`;
  document.body.appendChild(el);
  let done = false;
  const finish = () => { if(done) return; done = true; el.remove(); cb && cb(); };
  el.addEventListener("click", finish);
  setTimeout(finish, reduce ? 900 : 2600);
}

   {t:"Answer 1: The Victory", src:"Chabad.org, Who Was Antiochus? (Pri Chadash, Orach Chaim 670)", b:"The first day celebrates the victory over the Greeks, and the next seven days celebrate the miracle of the oil."},
   {t:"Answer 2: A Little Each Night", src:"Beis Yosef, Orach Chaim 670", b:"They knew new oil would take eight days, so they divided the oil into eight parts. Even on the first night, the small part burned all night: so all eight nights were a miracle."},

  ], key:"No answer; discussion.", teaches:"Why eight days."},

  question:"What happened, how do we know, and what do our sources emphasize?",
  answer:"Hashem gave the few victory over the many, and the Jews purified the Beis Hamikdash and lit its lights. V'Al Hanissim thanks Hashem for that rescue. The Gemara in Shabbos 21b tells of the one pure jar of oil that burned for eight days. Together they explain the eight days of Chanukah.", key:"Everyone seals.", teaches:"Summary."},

  title:"From then to now", paras:["The next year, the Sages set these eight days for Hallel and giving thanks. For more than two thousand years, Jews everywhere have lit the Chanukah lights.","But how exactly do we do it? Which candle comes first? Where does the menorah go? And what do we add to our davening?"],
  nextq:"Can we prepare for and celebrate Chanukah correctly?", key:"Read together.", teaches:"Bridge to Mission 5."},

   {q:"Where is the miracle of the oil told?", o:["Only in V'Al Hanissim","In the Gemara, Shabbos 21b","Nowhere"], a:1},
   {q:"How long did the oil in the jar burn?", o:["One day","Eight days","Seven nights"], a:1}],
  key:"The many into the hands of the few; Shabbos 21b; eight days.", teaches:"Individual check."},

/* ================= group state ================= */
function fresh(){return {team:"", names:[], step:0, opened:{}, satchel:[], p:{}, seals:{}, exitAns:{}, done:{}};}
function load(k){try{const s=JSON.parse(localStorage.getItem(k)); if(s) return s;}catch(e){} return null;}
function store(k,v){try{localStorage.setItem(k, JSON.stringify(v));}catch(e){}}
const missionKey = n => n===1 ? KEY_BASE : KEY_BASE + "-m" + n;
function useMission(n){
  MN = MISSIONS[n] ? n : 1; MIS = MISSIONS[MN];
  CHAMBERS = MIS.chambers; DRIVER_ROLE = MIS.driver; CHECK_CODES = MIS.codes; GATHER_CODES = MIS.gather || {}; STEPS = MIS.steps;
}
function loadGroup(n){ useMission(n); const s=load(missionKey(MN)); const g = s && Array.isArray(s.names) ? s : fresh(); if(g.done && g.done.seal1) g.done.seal = true; return g; }
let S = loadGroup(+(load(PICK_KEY)||1));
let frozen = false;
const save = () => { store(missionKey(MN), S); store(PICK_KEY, MN); };
const N = () => Math.max(1, S.names.length);
const ix = i => ((i % N()) + N()) % N();
const nm = i => S.names[ix(i)] || "Investigator";
const col = i => `var(--s${ix(i)})`;
const tag = i => `<span class="dot" style="background:${col(i)}"></span>${esc(nm(i))}`;
const step = () => STEPS[S.step];
function driverIndex(ch){ return DRIVER_ROLE[ch]!==undefined ? DRIVER_ROLE[ch] % N() : ch % N(); }
function rolesFor(i){ return ROLES.filter((r,ri)=> ri % N() === i); }

/* ================= group chrome ================= */
function groupShell(){
  $("#app").className = "wrap";
  $("#app").innerHTML = `
  <header class="top">
    <h1 class="brand"><small>Chanukah: Unlock the Story</small>The Sealed Scroll</h1>
    <div class="seals" id="seals" aria-label="Six seals"></div>
    <div class="tools"><button class="chip-btn" data-act="satchel" id="satchelBtn">Clue Book</button></div>
  </header>
  <nav class="track" id="track" aria-label="Chambers"></nav>
  <main class="stage" id="stage" aria-live="polite"></main>
  <div class="foot"><button data-act="teacher">Teacher</button></div>`;
}
function drawChrome(){
  const st = step();
  $("#seals").innerHTML = [1,2,3,4,5,6].map(i=>{
    const open = i < MN || (i===MN && S.done.seal), active = (i===MN && !open) || (i===MN+1 && S.done.seal);
    return `<span class="wax ${open?"open":""} ${active?"active":""}" title="Seal ${i}">${i}</span>`;}).join("");
  $("#track").style.gridTemplateColumns = `repeat(${CHAMBERS.length-1},1fr)`;
  $("#track").innerHTML = CHAMBERS.slice(1).map((c,i)=>{const ch=i+1, cls = st.ch>ch?"done":st.ch===ch?"now":""; return `<div class="stone ${cls}"><b>${ch}</b><span>${c.n}</span></div>`;}).join("");
  $("#satchelBtn").textContent = `Clue Book (${clueEntries().length})`;
  $("#satchelBtn").hidden = S.step===0 || st.kind==="exit";
}

/* ================= shared widgets ================= */
function driverLine(ch){
  if(ch<1 || ch===5) return "";
  return `<p class="driver">At the screen: ${tag(driverIndex(ch))} · everyone else guides</p>`;
}
function hintBlock(hs){
  const n = S.p.hint||0; hs = hs||[];
  if(!hs.length) return "";
  let h = hs.slice(0,n).map((t,i)=>`<div class="hintbox"><b>Hint ${i+1}.</b> ${esc(t)}</div>`).join("");
  if(n < hs.length) h += `<div><button class="btn ghost" data-act="hint">${n? "Another hint":"Need a hint?"}</button></div>`;
  return h;
}
function ritual(label){
  const all = S.names.every((_,i)=>S.seals[i]);
  return `<div class="ritual">
    <p><b>Everyone agree?</b> Tap your own seal.</p>
    <div class="sealrow">${S.names.map((n,i)=>`<button class="seal ${S.seals[i]?"on":""}" style="color:${col(i)}" data-act="seal" data-i="${i}" aria-pressed="${!!S.seals[i]}"><i><span>${esc(n.charAt(0).toUpperCase())}</span></i><small>${esc(n)}</small></button>`).join("")}</div>
    <div><button class="btn" data-act="check" ${all?"":"disabled"}>${label||"Check"}</button></div></div>`;
}
const winBlock = text => `<div class="feedback ok">${esc(text)}</div><div><button class="btn gold" data-act="next">Continue</button></div>`;
function cardHTML(c, owner, key){
  if(!S.opened[key]) return `<button class="card sealed" data-act="open" data-k="${key}"><span class="for">For ${tag(owner)}</span><span class="muted">Sealed note. ${esc(nm(owner))}, tap to open it.</span></button>`;
  let he = "";
  if(c.he) he = `<div class="he" lang="he">${c.he.map((w,j)=>`<button data-act="gloss" data-k="${key}" data-j="${j}">${w[0]}</button>`).join("")}</div><div class="gloss" id="gl-${key}">${S.p["g"+key]? esc(S.p["g"+key]) : "Tap a word."}</div>`;
  return `<article class="card ${c.he && c.he.length>5?"wide":""}"><span class="for">For ${tag(owner)}</span>${c.aloud?`<span class="aloud-tag">${esc(nm(owner))}: read this one aloud to your group</span>`:""}<h4>${esc(c.t)} ${c.y?`<span class="yr">${c.y}</span>`:""}</h4>${he}<p>${esc(c.b)}</p>${c.src?`<p class="muted" style="font-size:.85rem">Source: ${esc(c.src)}</p>`:""}${c.tts?`<button class="say-btn" data-act="speak" data-text="${esc(c.t+". "+c.b)}">Listen</button>`:""}</article>`;
}
const head = st => `<p class="eyebrow">${esc(st.eyebrow)}</p><h2>${esc(st.title)}</h2>${driverLine(st.ch)}`;

function MAN(x, y, o){ o=o||{}; const s=o.s||1, c=o.c||K.s2; let g="";
  if(o.spear) g+=`<line x1="${x+26*s}" y1="${y}" x2="${x+26*s}" y2="${y-150*s}" stroke="${K.s3}" stroke-width="${3*s}"/><path d="M${x+21*s} ${y-147*s} L${x+26*s} ${y-163*s} L${x+31*s} ${y-147*s}Z" fill="${K.s3}"/>`;

function TEMPLE(x, y, s, o){ s=s||1; o=o||{}; const w=300*s, wall=o.ruin?K.s1:K.s3;

function ALTAR(x, y, s){ s=s||1; return `<g><rect x="${x-40*s}" y="${y-50*s}" width="${80*s}" height="${50*s}" fill="${K.s1}"/><rect x="${x-46*s}" y="${y-58*s}" width="${92*s}" height="${10*s}" fill="${K.s2}"/><path class="a-fade" d="M${x-10*s} ${y-62*s} C${x-30*s} ${y-90*s} ${x+10*s} ${y-100*s} ${x-6*s} ${y-130*s}" stroke="${K.s3}" stroke-width="${5*s}" fill="none" opacity=".6"/></g>`; }

function BAG(x, y, s){ s=s||1; return `<g><path d="M${x-14*s} ${y} Q${x-20*s} ${y+30*s} ${x} ${y+32*s} Q${x+20*s} ${y+30*s} ${x+14*s} ${y}Z" fill="${K.gold}"/><rect x="${x-8*s}" y="${y-6*s}" width="${16*s}" height="${8*s}" fill="${K.wood}"/></g>`; }

  let g=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y-40*s}" stroke="${c}" stroke-width="${3*s}"/><line x1="${x-10*s}" y1="${y}" x2="${x+10*s}" y2="${y}" stroke="${c}" stroke-width="${3*s}"/>`;

function CHM(x, y, s, o){ s=s||1; o=o||{}; /* Chanukah menorah: 8 + shamash in the middle, raised */

  1: () => SKY(K.sky)+`<circle cx="620" cy="110" r="50" fill="${K.flame}"/>`+HILLS()+TEMPLE(400,380,1.15)+GROUND(380)+LB(400,430,"The Second Beis Hamikdash",26,K.gold),
  2: () => SKY()+`<circle cx="400" cy="200" r="150" fill="${K.flame}" opacity=".12" class="a-glow"/>`+`<rect x="330" y="120" width="140" height="190" rx="10" fill="${K.parch}"/><rect x="310" y="100" width="22" height="230" rx="10" fill="${K.wood}"/><rect x="468" y="100" width="22" height="230" rx="10" fill="${K.wood}"/>`+[0,1,2,3,4,5].map(i=>`<line x1="350" x2="450" y1="${150+i*24}" y2="${150+i*24}" stroke="${K.s2}" stroke-width="5"/>`).join("")+LB(400,400,"They held on to the Torah",28,K.gold),
  3: () => SKY(K.sky)+HILLS(K.green,K.d1)+`<line x1="400" y1="170" x2="400" y2="320" stroke="${K.wood}" stroke-width="8"/><path d="M404 175 H560 L530 210 L560 245 H404Z" fill="${K.red}"/>`+LB(478,226,"מכבי",34,K.parch,true)+[250,300,520,570,620].map((x,i)=>MAN(x,380,{s:.7,c:i%2?K.s2:K.s1})).join("")+LB(400,430,"Mi kamocha ba'eilim Hashem",24,K.gold),
  4: () => SKY()+`<circle cx="400" cy="220" r="160" fill="${K.flame}" opacity=".15" class="a-glow"/>`+JAR(400,330,2,"kg")+LB(400,410,"One jar, with the seal of the Kohen Gadol",24,K.gold),
  5: () => SKY(K.sky)+`<rect x="250" y="60" width="300" height="330" fill="${K.s1}"/><rect x="300" y="100" width="200" height="290" fill="${K.d1}"/><rect x="505" y="160" width="10" height="44" rx="3" fill="${K.gold}" transform="rotate(-20 510 182)"/>`+CHM(330,330,.32,{cand:[0,1,2,3,4,5,6,7],lit:[0,1,2,3,4,5,6,7],sh:true})+GROUND(390)+LB(400,432,"The menorah opposite the mezuzah",24,K.gold),
  6: () => SKY()+[...Array(30)].map((_,i)=>`<circle cx="${(i*137)%800}" cy="${(i*61)%160+10}" r="2" fill="${K.parch}"/>`).join("")+[100,250,400,550,700].map((x,i)=>HOUSE(x,380,.9,{win:true,c:i%2?K.s1:"#6B6352"})).join("")+GROUND(380)+LB(400,430,"Light that fills the street",26,K.gold)
};
const PICCAP = {1:"Seal 1's picture: the Second Beis Hamikdash.", 2:"Seal 2's picture: the Torah they would not give up.", 3:"Seal 3's picture: the banner of the Maccabees.", 4:"Seal 4's picture: the one pure jar.", 5:"Seal 5's picture: a menorah lit in the doorway.", 6:"Seal 6's picture: a street full of light."};
function picHTML(shown){ const pic = PICS[MN]; if(!pic) return ""; const n = STEPS.filter(s=>s.kind==="checkin").length + 1, w = 800/n;
  let cover=""; for(let k=shown;k<n;k++) cover+=`<rect x="${k*w}" y="0" width="${w+1}" height="450" fill="${K.d1}" stroke="${K.d2}" stroke-width="3"/>${LB(k*w+w/2, 240, "?", 64, K.s1)}`;
  return `<div class="picbox">${SV(pic()+cover)}</div><p class="muted" style="text-align:center">${shown>=n? esc(PICCAP[MN]) : `Picture piece ${shown} of ${n}. Each chamber you finish reveals another piece.`}</p>`; }
function picFull(){ return PICS[MN] ? picHTML(99) : ""; }

/* ================= renderers ================= */
const owner = (st, i) => i + driverIndex(st.ch);

R.clip = st => {
  const f = Math.min(S.p.f||0, st.cards.length-1), fr = st.cards[f], last = f===st.cards.length-1;
  S.opened[st.id+"-"+f] = true;
  return `${head(st)}<p class="lead">${esc(st.lead||"A short clip. Read each caption yourselves: the person named reads it aloud.")}</p>
   <div class="clip"><div class="clipart">${SV(fr.art())}</div>
   <div class="clipcap"><span class="for">${tag(owner(st,f))} reads this one aloud</span><h4>${esc(fr.t)} ${fr.y?`<span class="yr">${fr.y}</span>`:""}</h4><p>${esc(fr.b)}</p>${fr.src?`<p class="muted" style="font-size:.85rem">Source: ${esc(fr.src)}</p>`:""}</div></div>
   <div class="row clipnav"><button class="btn ghost" data-act="clipb" ${f?"":"disabled"}>Back</button><span class="muted">Scene ${f+1} of ${st.cards.length}</span>${last?`<button class="btn gold" data-act="next">${esc(st.cta||"Continue")}</button>`:`<button class="btn" data-act="clipn">Next scene</button>`}</div>`;
};

R.text = st => {
  const rv = S.p.rv||{}, got = S.p.got||{}, all = st.phr.every((_,i)=>rv[i]), fi = S.p.fi||0, done = !!S.p.solved;
  const a = owner(st,0), b = owner(st,1);
  let h = `${head(st)}<div class="srcbar"><span class="srcname">${esc(st.src)}</span><span class="muted">${esc(st.lang||"Hebrew and Aramaic")}</span></div><p class="lead">${esc(st.lead)}</p>`;
  if(!all) h += `<p class="muted">Read it like a chavrusa. ${tag(a)} reads a line in the original aloud, then taps it. ${tag(b)} reads the English that appears. Switch every line, until every line is open (${Object.keys(rv).length} of ${st.phr.length}).</p>`;
  h += `<div class="ttext" lang="he">${st.phr.map((p,i)=>`<button class="tph ${rv[i]?"open":""} ${got[i]?"found":""}" data-act="${all&&!done?"tfind":"trev"}" data-i="${i}"><span class="tphh">${p[0]}</span>${rv[i]?`<span class="tphe" lang="en">${esc(p[1])}</span>`:""}</button>`).join("")}</div>`;
  if(S.p.okmsg) h += `<div class="feedback ok">${esc(S.p.okmsg)}</div>`;
  if(all && !done){ const q = st.finds[fi]; h += `<div class="feedback info findq"><b>Find it in the text (${fi+1} of ${st.finds.length}):</b> ${esc(q.q)}<br><span class="muted">Tap the line in the text that says it.</span></div>${S.p.fb?`<div class="feedback no">${esc(S.p.fb)}</div>`:""}`; }
  if(done) h += winBlock(st.win);
  return h;
};

R.split = st => {
  const seen = S.p.seen||{}, sh = S.p.show, allSeen = st.cards.every((_,i)=>seen[i]);
  let h = `${head(st)}<p class="lead">${esc(st.lead)}</p><div class="cards">${st.cards.map((c,i)=> sh===i
    ? `<article class="card secret"><span class="for">Only ${tag(owner(st,i))} looks</span><h4>${esc(c.t)} ${c.y?`<span class="yr">${c.y}</span>`:""}</h4>${c.he?`<div class="he" lang="he">${c.he.map(w=>`<span class="hw">${w[0]}</span>`).join("")}</div><p class="muted">${c.he.map(w=>w[0]+" = "+w[1]).join(" · ")}</p>`:""}<p>${esc(c.b)}</p>${c.src?`<p class="muted" style="font-size:.85rem">Source: ${esc(c.src)}</p>`:""}<button class="btn" data-act="sphide">I've read it. Hide my clue</button></article>`
    : `<button class="card sealed" data-act="spshow" data-i="${i}" ${sh!==undefined&&sh!==null?"disabled":""}><span class="for">Secret clue for ${tag(owner(st,i))}</span><span class="muted">${seen[i]?`${esc(nm(owner(st,i)))} has read this. Only ${esc(nm(owner(st,i)))} may open it again.`:`Everyone else looks away! ${esc(nm(owner(st,i)))}, tap to read it.`}</span></button>`).join("")}</div>`;
  if(!allSeen){ h += `<p class="muted">Each of you reads your own secret clue and hides it again. No showing the screen: you will have to tell each other.</p>`; return h; }
  const pk = S.p.pick, opt = pk? st.options.find(o=>o[0]===pk) : null;
  h += `<div class="feedback info"><b>Now talk.</b> Each of you tells the group what your clue said, in your own words. Then answer together.</div><p class="lead">${esc(st.q)}</p>
   <div class="choices">${st.options.map(o=>`<button class="choice ${pk===o[0]?"picked":""}" data-act="pick" data-id="${o[0]}" ${S.p.solved?"disabled":""}>${esc(o[1])}</button>`).join("")}</div>
   ${S.p.fb? `<div class="feedback no">${esc(S.p.fb)}</div>`:""}
   ${S.p.solved? winBlock(opt[3]) : hintBlock(st.hints||[]) + (pk? ritual("Lock in this answer"):"")}`;
  return h;
};

R.comic = st => {
  const pl = S.p.place||{}, sel = S.p.sel, used = Object.values(pl), line = id => st.lines.find(l=>l[0]===id)[1];
  const pool = st.lines.filter(l=>!used.includes(l[0]));
  return `${head(st)}<p class="lead">${esc(st.lead)}</p>
   <div class="comic">${st.panels.map((p,i)=>`<div class="cpanel"><div class="cart">${SV(p.art(), "0 0 400 260")}</div><p class="ccap">${esc(p.cap)}</p>${p.speaker?`<button class="bubble ${pl[i]?"full":""} ${sel?"armed":""}" data-act="cbub" data-i="${i}" ${S.p.solved?"disabled":""}><b>${esc(p.speaker)}:</b> ${pl[i]?`“${esc(line(pl[i]))}”`:`<span class="muted">empty speech bubble${sel?": tap to put the line here":""}</span>`}</button>`:""}</div>`).join("")}</div>
   ${!S.p.solved && pool.length? `<p class="muted">Tap a line, then tap the speech bubble where it belongs. One line doesn't belong anywhere.</p><div class="pool">${pool.map(l=>`<button class="tile ${sel===l[0]?"sel":""}" data-act="sel" data-id="${l[0]}">“${esc(l[1])}”</button>`).join("")}</div>`:""}
   ${S.p.fb? `<div class="feedback no">${esc(S.p.fb)}</div>`:""}
   ${S.p.solved? winBlock(st.win) : hintBlock(st.hints||[]) + (st.panels.every((p,i)=>!p.speaker||pl[i])? ritual("Check the comic"):"")}`;
};

R.zoom = st => {
  const lv = S.p.lv||0, L = st.cards, final = lv>=L.length, done = !!S.p.solved;
  const sc = done ? 1 : st.scales[Math.min(lv, st.scales.length-1)], prev = S.p.prev || sc, [fx,fy] = st.focus;
  if(!final) S.opened[st.id+"-"+lv] = true;
  let h = `${head(st)}<p class="lead">${esc(st.lead)}</p>
   <div class="zoombox"><svg viewBox="0 0 800 450" aria-label="Mystery picture"><g class="zg" style="transform-origin:${fx}px ${fy}px;--z0:${prev};--z1:${sc}">${st.pic()}</g></svg><span class="zbadge">${done?"Full picture":`Zoom ${Math.round(sc)}x`}</span></div>`;
  S.p.prev = sc;
  if(!final){ const c = L[lv]; h += `<article class="card"><span class="for">${tag(owner(st,lv))} reads this aloud</span><h4>${esc(c.t)}</h4><p>${esc(c.b)}</p>${c.src?`<p class="muted" style="font-size:.85rem">Source: ${esc(c.src)}</p>`:""}</article>
     <p class="lead">${esc(c.q)}</p><div class="choices">${c.o.map((o,j)=>`<button class="choice" data-act="zopt" data-j="${j}">${esc(o)}</button>`).join("")}</div>${S.p.fb?`<div class="feedback no">${esc(S.p.fb)}</div>`:""}<p class="muted">Each right answer zooms the picture out. You can guess the mystery object at the end.</p>`; }
  else if(!done) h += `<p class="lead">${esc(st.guess.q)}</p><div class="choices">${st.guess.o.map((o,j)=>`<button class="choice" data-act="zguess" data-j="${j}">${esc(o)}</button>`).join("")}</div>${S.p.fb?`<div class="feedback no">${esc(S.p.fb)}</div>`:""}`;
  else h += winBlock(st.win);
  return h;
};

let FLP = {x:50, y:50};
R.flash = st => {
  const found = st.cards.map((_,i)=>!!S.opened[st.id+"-"+i]), k = found.filter(Boolean).length, all = k===st.cards.length;
  return `${head(st)}<p class="lead">${esc(st.lead)}</p>
   <div class="flashbox" id="flashbox" style="--mx:${FLP.x}%;--my:${FLP.y}%">${SV(st.scene())}
     ${st.cards.map((c,i)=>`<button class="fspot ${found[i]?"got":""}" style="left:${c.x}%;top:${c.y}%" data-act="fspot" data-i="${i}" aria-label="${found[i]?esc(c.t):"Something hidden in the dark"}">${SV(c.icon||ICO.note,"0 0 40 40")}</button>`).join("")}
     <div class="dark ${all?"off":""}"></div></div>
   <p class="muted">${all?"Everything is found.":`Drag your finger (or the mouse) to move the light. Tap anything you find. Found ${k} of ${st.cards.length}. Take turns holding the light.`}</p>
   <div class="cards">${st.cards.map((c,i)=>found[i]?`<article class="card"><span class="for">${tag(owner(st,i))} reads this aloud</span><h4>${esc(c.t)} ${c.y?`<span class="yr">${c.y}</span>`:""}</h4><p>${esc(c.b)}</p>${c.src?`<p class="muted" style="font-size:.85rem">Source: ${esc(c.src)}</p>`:""}</article>`:"").join("")}</div>
   ${all?`<div><button class="btn gold" data-act="next">${esc(st.cta||"Continue")}</button></div>`:""}`;
};
const ICO = {
  note: `<rect x="8" y="10" width="24" height="20" rx="3" fill="#F2E5C6"/><rect x="5" y="8" width="6" height="24" rx="3" fill="#9C927C"/><rect x="29" y="8" width="6" height="24" rx="3" fill="#9C927C"/>`,
  light: `<rect x="14" y="20" width="12" height="14" fill="#E3B252"/><path d="M20 20 C14 13 18 8 20 3 C22 8 26 13 20 20Z" fill="#F2B04A"/>`
};

R.spot = st => {
  const got = S.p.got||{}, k = Object.keys(got).length, n = st.marks.length;
  return `${head(st)}<p class="lead">${esc(st.lead)}</p>
   <div class="spotbox"><svg viewBox="0 0 800 450" data-act="spotsvg" role="img" aria-label="${esc(st.alt||"Picture with mistakes")}">${st.scene()}${st.marks.map((m,i)=>got[i]?`<g><circle cx="${m.x}" cy="${m.y}" r="${m.r}" fill="none" stroke="#FFFFFF" stroke-width="9"/><circle cx="${m.x}" cy="${m.y}" r="${m.r}" fill="none" stroke="#C0283A" stroke-width="5"/><circle cx="${m.x+m.r*.8}" cy="${m.y-m.r*.8}" r="13" fill="#C0283A"/>${LB(m.x+m.r*.8,m.y-m.r*.8+7,i+1,18,"#FFFFFF")}</g>`:"").join("")}</svg></div>
   <p class="muted">Found ${k} of ${n} mistakes. Tap the picture where something is wrong.</p>
   ${S.p.msg?`<div class="feedback ${S.p.msgok?"ok":"no"}">${esc(S.p.msg)}</div>`:""}
   ${k?`<ol class="spotlist">${st.marks.map((m,i)=>got[i]?`<li value="${i+1}">${esc(m.t)}</li>`:"").join("")}</ol>`:""}
   ${k===n? winBlock(st.win) : hintBlock(st.hints||[])}`;
};

R.jars = st => {
  const ins = S.p.ins, seen = S.p.seen||{};
  return `${head(st)}<p class="lead">${esc(st.lead)}</p>
   <div class="feedback info">${st.rule}</div>
   <div class="jargrid">${st.items.map((it,i)=>`<button class="jarb ${ins===i?"sel":""} ${seen[i]?"seen":""}" data-act="jins" data-i="${i}" ${S.p.solved?"disabled":""} aria-label="Jar ${i+1}">${SV(JAR(60,140,1.15,it.seal),"0 0 120 150")}<span>Jar ${i+1}</span></button>`).join("")}</div>
   ${ins!==undefined && ins!==null && !S.p.solved? `<article class="card"><h4>Jar ${ins+1}</h4><p>${esc(st.items[ins].d)}</p><div class="row"><button class="btn gold" data-act="jpick">This is the pure jar</button></div></article>`:""}
   ${S.p.fb? `<div class="feedback no">${esc(S.p.fb)}</div>`:""}
   ${S.p.solved? winBlock(st.win) : `<p class="muted">Tap a jar to inspect it. Take turns.</p>`}`;
};

function mazeCell(st, r, c){ return st.grid[r][c]; }
R.maze = st => {
  const g = st.grid, R0 = g.length, C0 = g[0].length;
  if(!S.p.pos){ for(let r=0;r<R0;r++) for(let c=0;c<C0;c++) if(g[r][c]==="S") S.p.pos=[r,c]; S.p.vis={}; }
  const [pr,pc] = S.p.pos, vis = S.p.vis||{}; vis[pr+","+pc]=1; S.p.vis = vis;
  const near = (r,c,d) => Math.max(Math.abs(r-pr),Math.abs(c-pc))<=d;
  const cps = st.cards.map((_,i)=>!!S.opened[st.id+"-"+i]);
  let cells = "";
  for(let r=0;r<R0;r++) for(let c=0;c<C0;c++){
    const v = g[r][c], known = near(r,c,1) || vis[r+","+c] || v==="G" || (v==="P" && near(r,c,2));
    let cls = "mc-fog", inner = "";
    if(known){ cls = v==="#"?"mc-wall":"mc-path";
      if(v==="P"){ cls="mc-path mc-pat"; inner=SV(MAN(20,40,{s:.33,c:K.red,helmet:true}),"0 0 40 44"); }
      if(/[1-9]/.test(v)) { inner = cps[+v-1]? "" : SV(ICO.note,"0 0 40 40"); }
      if(v==="G") { cls="mc-path mc-goal"; inner=SV(`<rect x="6" y="14" width="28" height="22" fill="${K.s3}"/><rect x="12" y="6" width="16" height="10" fill="${K.s3}"/><rect x="17" y="24" width="6" height="12" fill="${K.gold}"/>`,"0 0 40 40"); }
    }
    if(r===pr && c===pc){ cls += " mc-me"; inner = SV(`<line x1="14" y1="36" x2="14" y2="6" stroke="${K.wood}" stroke-width="3"/><path d="M15 7 H34 L29 13 L34 19 H15Z" fill="${K.red}"/><circle cx="22" cy="30" r="7" fill="${K.gold}"/>`,"0 0 40 40"); }
    cells += `<div class="${cls}">${inner}</div>`;
  }
  const dirs = [["up","Up",0],["right","Right",1],["down","Down",2],["left","Left",3]];
  return `${head(st)}<p class="lead">${esc(st.lead)}</p>
   <div class="mazewrap"><div class="maze" style="grid-template-columns:repeat(${C0},1fr)">${cells}</div>
   <div class="mazepad">${dirs.map(d=>`<button class="mdir md-${d[0]}" data-act="mmove" data-d="${d[0]}" ${S.p.solved?"disabled":""}><b>${esc(d[1])}</b><span>${esc(nm(d[2]))}</span></button>`).join("")}</div></div>
   <p class="muted">Each of you moves the Maccabees in one direction only: press only the arrow with your name. You can see one step around you, and patrols two steps away. Collect all ${st.cards.length} battle notes, then reach Yerushalayim.</p>
   ${S.p.msg?`<div class="feedback ${S.p.msgok?"ok":"no"}">${esc(S.p.msg)}</div>`:""}
   <div class="cards">${st.cards.map((c,i)=>cps[i]?`<article class="card"><span class="for">${tag(owner(st,i))} reads this aloud</span><h4>${esc(c.t)}</h4><p>${esc(c.b)}</p></article>`:"").join("")}</div>
   ${S.p.solved? winBlock(st.win):""}`;
};

R.pour = st => {
  const tried = S.p.tried||{}, plan = S.p.plan, both = tried.a && tried.b;
  const lamp = (i, kind) => `<g class="a-pop" style="animation-delay:${.2+i*.25}s"><path d="M${60+i*90} 300 C${66+i*90} 318 ${114+i*90} 318 ${124+i*90} 296 L${108+i*90} 292 C${102+i*90} 284 ${78+i*90} 284 ${72+i*90} 292Z" fill="${K.gold}"/>${FLM(120+i*90, 292, 1.3)}${LB(92+i*90, 350, "Night "+(i+1), 15)}${LB(92+i*90, 376, kind==="m"?"miracle":"natural", 16, kind==="m"?K.flame:K.s3)}${kind==="m"?`<circle cx="${120+i*90}" cy="275" r="22" fill="${K.flame}" opacity=".25" class="a-glow"/>`:""}</g>`;
  const plans = {a:{label:"Pour all the oil in on the first night", kinds:["n","m","m","m","m","m","m","m"], text:"The oil was enough for one night, so night 1 was natural. Nights 2 to 8 burned with no oil: 7 nights of miracle."},
                 b:{label:"Divide the oil into 8 small parts", kinds:["m","m","m","m","m","m","m","m"], text:"Each night had only one eighth of the oil: not enough to burn all night. But every night it burned all night: 8 nights of miracle!"}};
  let art = SV(`<rect width="800" height="420" fill="${K.bg}"/>`+JAR(400,140,1,"kg")+LB(400,172,"enough oil for one night",18,K.s3)+(plan? plans[plan].kinds.map((k,i)=>lamp(i,k)).join("") : LB(400,290,"Choose a plan to see what happens",24,K.s3)), "0 0 800 420");
  return `${head(st)}<p class="lead">${esc(st.lead)}</p><div class="pourbox">${art}</div>
   <div class="choices">${["a","b"].map(p=>`<button class="choice ${plan===p?"picked":""}" data-act="pplan" data-p="${p}">${tried[p]?"✓ ":""}${esc(plans[p].label)}</button>`).join("")}</div>
   ${plan?`<div class="feedback info">${esc(plans[plan].text)}</div>`:""}
   ${both? `<div class="feedback ok">${esc(st.win)}</div><div><button class="btn gold" data-act="next">Continue</button></div>` : `<p class="muted">Try both plans, then compare.</p>`}`;
};

const DL = [["נ",50,"נֵס, nes: a miracle"],["ג",3,"גָּדוֹל, gadol: great"],["ה",5,"הָיָה, haya: happened"],["ש",300,"שָׁם, sham: there"]];
R.dreidel = st => {
  const got = S.p.dl||{}, all = DL.every(d=>got[d[0]]);
  const table = () => `<div class="dltable">${DL.map(d=>`<div class="dl ${got[d[0]]?"got":""}"><span class="dlh" lang="he">${d[0]}</span><b>${got[d[0]]?d[1]:"?"}</b><small>${got[d[0]]?esc(d[2]):"not yet"}</small></div>`).join("")}</div>`;
  if(all){ st.pre = () => `<p class="lead">You landed on all four letters. Here are their values.</p>${table()}`; return R.lock2(st); }
  return `${head(st)}${action(ICON_WALK,"Spin a real dreidel",`<p>Take the dreidel from the teacher's table. Take turns spinning it. Every time it lands on a letter you don't have yet, tap that letter below. No dreidel? Spin the one on the tablet.</p>`)}
   <div class="dreidelrow"><div class="dreidel ${S.p.spin?"spin":""}">${SV(`<path d="M40 30 H120 V120 L80 170 L40 120Z" fill="${K.gold}"/><rect x="72" y="6" width="16" height="26" rx="4" fill="${K.wood}"/>${LB(80,100,S.p.last||"נ",56,K.d1,true)}`,"0 0 160 180")}</div>

const XSOLVE = {
  clip: st => { if((S.p.f||0) < st.cards.length-1){ S.p.f = st.cards.length-1; return "stay"; } return false; },
  text: st => { st.phr.forEach((_,i)=>{ (S.p.rv=S.p.rv||{})[i]=true; }); S.p.fi = st.finds.length; },
  split: st => { S.p.seen = Object.fromEntries(st.cards.map((_,i)=>[i,true])); S.p.show=null; S.p.pick = st.options.find(o=>o[2])[0]; },
  comic: st => { S.p.place = Object.fromEntries(st.panels.map((p,i)=>[i,p.line]).filter(x=>x[1])); },
  zoom: st => { S.p.lv = st.cards.length; },
  flash: st => { if(st.cards.every((_,i)=>S.opened[st.id+"-"+i])) return false; st.cards.forEach((_,i)=>S.opened[st.id+"-"+i]=true); return "stay"; },
  spot: st => { S.p.got = Object.fromEntries(st.marks.map((_,i)=>[i,true])); },
  jars: st => { S.p.ins = st.items.findIndex(it=>it.ok); },
  maze: st => { st.cards.forEach((_,i)=>S.opened[st.id+"-"+i]=true); },
  pour: st => { if(S.p.tried && S.p.tried.a && S.p.tried.b) return false; S.p.tried = {a:true,b:true}; S.p.plan="b"; return "stay"; },
  dreidel: st => { S.p.dl = Object.fromEntries(DL.map(d=>[d[0],true])); S.p.part = 0; }
};
function xForce(st){
  const f = XSOLVE[st.kind]; if(!f || S.p.solved) return false;

}
function xCheck(st){

document.addEventListener("click", e=>{

  const a = el.dataset.act, st = step(), p = S.p;

    case "clipb": p.f = Math.max((p.f||0)-1, 0); render(); break;
    case "trev": p.rv = Object.assign({}, p.rv, {[el.dataset.i]:true}); p.okmsg=null; render(); break;
    case "tfind": {
      const i = +el.dataset.i, q = st.finds[p.fi||0];
      if(q.a.includes(i)){ p.got = Object.assign({}, p.got); q.a.forEach(k=>p.got[k]=true); p.okmsg = q.ok; p.fb=null; p.fi=(p.fi||0)+1; if(p.fi>=st.finds.length) p.solved=true; }
      else { p.fb = "Not that line. Read the English of each line again: which one says it?"; p.okmsg=null; }
      render(); break; }
    case "spshow": p.show = +el.dataset.i; p.seen = Object.assign({}, p.seen, {[el.dataset.i]:true}); render(); break;
    case "sphide": p.show = null; render(); break;
    case "cbub": {
      const i = el.dataset.i, pl = Object.assign({}, p.place);
      if(p.sel){ Object.keys(pl).forEach(k=>{ if(pl[k]===p.sel) delete pl[k]; }); pl[i]=p.sel; p.sel=null; }
      else if(pl[i]) delete pl[i];
      p.place = pl; p.fb=null; S.seals={}; render(); break; }
    case "zopt": {
      const c = st.cards[p.lv||0], j = +el.dataset.j;
      if(j===c.a){ p.lv=(p.lv||0)+1; p.fb=null; } else p.fb = c.no || "Not quite. Read the note again.";
      render(); break; }
    case "zguess": { const j = +el.dataset.j; if(j===st.guess.a){ p.solved=true; p.fb=null; } else p.fb = st.guess.no; render(); break; }
    case "fspot": S.opened[st.id+"-"+el.dataset.i]=true; render(); break;
    case "spotsvg": {
      const svg = el, pt = svg.createSVGPoint(); pt.x=e.clientX; pt.y=e.clientY;
      const m = svg.getScreenCTM(); if(!m) return; const q = pt.matrixTransform(m.inverse());
      const hit = arr => arr.findIndex(z=>Math.hypot(z.x-q.x, z.y-q.y) <= z.r + 12);
      const i = hit(st.marks), o = hit(st.oks||[]);
      if(i>=0){ p.got = Object.assign({}, p.got, {[i]:true}); p.msg = "Found one! " + st.marks[i].t; p.msgok = true; }
      else if(o>=0){ p.msg = st.oks[o].t; p.msgok = true; }
      else { p.msg = "Nothing wrong there. Look again."; p.msgok = false; }
      render(); break; }
    case "jins": p.ins = +el.dataset.i; p.seen = Object.assign({}, p.seen, {[el.dataset.i]:true}); p.fb=null; render(); break;
    case "jpick": { const it = st.items[p.ins]; if(it.ok){ p.solved=true; p.fb=null; } else p.fb = it.no || "That jar can't be used. Check the rule again."; render(); break; }
    case "mmove": {
      if(p.solved) return;
      const g = st.grid, [r,c] = p.pos, [dr,dc] = MD[el.dataset.d], nr=r+dr, nc=c+dc;
      if(nr<0||nc<0||nr>=g.length||nc>=g[0].length||g[nr][nc]==="#"){ p.msg = "A steep hill blocks the way."; p.msgok=false; render(); return; }
      const v = g[nr][nc];
      if(v==="P"){ for(let rr=0;rr<g.length;rr++) for(let cc=0;cc<g[0].length;cc++) if(g[rr][cc]==="S") p.pos=[rr,cc]; p.msg = "A Greek patrol saw you! The Maccabees slip back to their hideout in the hills. Find a way around the patrol."; p.msgok=false; render(); return; }
      p.pos=[nr,nc]; p.msg=null;
      if(/[1-9]/.test(v) && !S.opened[st.id+"-"+(+v-1)]){ S.opened[st.id+"-"+(+v-1)]=true; p.msg = "You found a battle note: " + st.cards[+v-1].t + ". Read it below."; p.msgok=true; }
      if(v==="G"){ const left = st.cards.filter((_,k)=>!S.opened[st.id+"-"+k]).length;
        if(!left){ p.solved=true; p.msg=null; } else { p.msg = `Yerushalayim is ahead, but you still need ${left} more battle note${left>1?"s":""} first.`; p.msgok=false; } }
      render(); break; }
    case "pplan": p.plan = el.dataset.p; p.tried = Object.assign({}, p.tried, {[el.dataset.p]:true}); render(); break;
    case "dspin": {
      if(p.spin) return; p.spin = true; render();

  }
});

/* ---- rub: clean a dirty picture with your finger ---- */
R.rub = st => {
  const rv = S.p.rv||{}, all = st.cards.every((_,i)=>rv[i]);
  setTimeout(initRub, 30);
  return `${head(st)}<p class="lead">${esc(st.lead)}</p>
   <div class="rubgrid ${st.cards.length===1?"one":""}">${st.cards.map((c,i)=>`<div class="rubpanel">
     <div class="rubbox">${SV(c.art())}${rv[i]?"":`<canvas class="rubcv" data-i="${i}" aria-label="Dirty panel: rub it clean"></canvas>`}</div>
     ${rv[i]?`<p class="rubcap"><b>${esc(c.t)}.</b> ${esc(c.b)}</p>`:`<p class="muted">${tag(owner(st,i))} rubs this one clean</p>`}</div>`).join("")}</div>
   ${all?`<div><button class="btn gold" data-act="next">${esc(st.cta||"Continue")}</button></div>`:`<p class="muted">Rub with your finger to clean off the dirt.</p>`}`;
};
function initRub(){
  document.querySelectorAll("canvas.rubcv").forEach(cv=>{
    if(cv.dataset.ready) return; cv.dataset.ready = 1;
    const r = cv.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio||1);
    cv.width = Math.max(1, Math.round(r.width*dpr)); cv.height = Math.max(1, Math.round(r.height*dpr));
    const g = cv.getContext("2d");
    g.fillStyle = "#6B5F4D"; g.fillRect(0,0,cv.width,cv.height);
    let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
    for(let k=0;k<520;k++){ g.fillStyle = `rgba(${50+rnd()*70|0},${42+rnd()*55|0},${30+rnd()*40|0},.55)`; g.beginPath(); g.arc(rnd()*cv.width, rnd()*cv.height, (3+rnd()*14)*dpr, 0, 7); g.fill(); }
    g.fillStyle = "rgba(242,229,198,.9)"; g.font = `700 ${18*dpr}px sans-serif`; g.textAlign = "center"; g.fillText("Rub here", cv.width/2, cv.height/2);
    let down = false, moves = 0, last = null;
    const pt = e => { const b = cv.getBoundingClientRect(); return [(e.clientX-b.left)*dpr, (e.clientY-b.top)*dpr]; };
    const scrub = e => { const p = pt(e); g.globalCompositeOperation = "destination-out"; g.lineCap = "round"; g.lineWidth = 46*dpr;
      g.beginPath(); g.moveTo(...(last||p)); g.lineTo(...p); g.stroke(); g.globalCompositeOperation = "source-over"; last = p; if(++moves%15===0) checkRub(cv, g); };
    cv.addEventListener("pointerdown", e=>{ down = true; last = null; try{ cv.setPointerCapture(e.pointerId); }catch(err){} scrub(e); });
    cv.addEventListener("pointermove", e=>{ if(down) scrub(e); });
    ["pointerup","pointercancel"].forEach(ev=>cv.addEventListener(ev, ()=>{ if(down){ down = false; last = null; checkRub(cv, g); } }));
  });
}
function checkRub(cv, g){
  if(cv.dataset.done) return;
  const d = g.getImageData(0,0,cv.width,cv.height).data; let clear = 0, tot = 0;
  for(let i=3;i<d.length;i+=4*61){ tot++; if(d[i]<60) clear++; }
  if(clear/tot > 0.55){ cv.dataset.done = 1; const st = step(); S.p.rv = Object.assign({}, S.p.rv, {[cv.dataset.i]:true}); S.opened[st.id+"-"+cv.dataset.i] = true; render(); }
}

/* ---- cipher wheel ---- */
const ABC = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const enc = (t, k) => t.replace(/[A-Z]/g, c=>ABC[(ABC.indexOf(c)+k)%26]);
R.cipher = st => {
  const r = S.p.r ?? st.start, coded = enc(st.msg, st.shift), reading = enc(coded, (26 - r)%26), right = r===st.shift;
  const ring = (rad, rot, letters, fill, size) => `<g transform="rotate(${rot} 200 200)">${letters.split("").map((L,i)=>{ const a=(i*360/26-90)*Math.PI/180; return `<text x="${200+rad*Math.cos(a)}" y="${200+rad*Math.sin(a)+size/3}" text-anchor="middle" font-family="Atkinson Hyperlegible, sans-serif" font-weight="700" font-size="${size}" fill="${fill}" transform="rotate(${i*360/26} ${200+rad*Math.cos(a)} ${200+rad*Math.sin(a)})">${L}</text>`; }).join("")}</g>`;
  const wheel = `<circle cx="200" cy="200" r="196" fill="#5C4A2E"/><circle cx="200" cy="200" r="190" fill="#E9C477"/>${ring(170, 0, ABC, "#2A2418", 22)}
    <g class="cinner"><circle cx="200" cy="200" r="140" fill="#3A3F63"/>${ring(118, -r*360/26, ABC, "#F2E5C6", 20)}<circle cx="200" cy="200" r="70" fill="#151B2A"/>${FLM(200, 212, 1.4)}</g>
    <path d="M200 20 L190 2 H210Z" fill="#9B2D3A"/>`;
  return `${head(st)}<p class="lead">${esc(st.lead)}</p>
   <div class="cmsg"><span class="muted">The coded message:</span><b>${esc(coded)}</b></div>
   <div class="cipherwrap"><div class="cwheel" id="cwheel">${SV(wheel, "0 0 400 400")}</div>
     <div class="cside"><div class="row"><button class="btn" data-act="crot" data-d="-1" aria-label="Turn the inner ring left">&#10226; Turn</button><button class="btn" data-act="crot" data-d="1" aria-label="Turn the inner ring right">Turn &#10227;</button></div>

let revealTarget = null;
function render(){
  if(IS_CONTROL) return renderControl();
  if(S.step>=STEPS.length) S.step = STEPS.length-1;
  const st = step();
  const hadRitual = !!document.querySelector(".ritual"), hadWin = !!document.querySelector(".feedback.ok");
  $("#stage").innerHTML = R[st.kind](st);
  drawChrome(); save();
  let t = null;
  if(revealTarget){ t = document.querySelector(revealTarget); revealTarget = null; }
  else if(!hadRitual && document.querySelector(".ritual")) t = document.querySelector(".ritual");
  else if(!hadWin && document.querySelector(".feedback.ok")) t = document.querySelector(".feedback.ok");
  else if(document.querySelector(".feedback.no")) t = document.querySelector(".feedback.no");
  if(t){ try{ t.scrollIntoView({block:"nearest"}); }catch(e){} }
}
function advance(){
  if(S.step < STEPS.length-1) S.step++;
  S.p = {}; S.seals = {};
  render();
  try{ window.scrollTo(0,0); }catch(e){}
}
function next(){
  const st = step();
  if(st.satchel) st.satchel.forEach(x=>{ if(!S.satchel.includes(x)) S.satchel.push(x); });
  if(st.id===MIS.sealStep) S.done.seal = true;
  const nx = STEPS[S.step+1];
  const sc = st.out || (nx && nx.enter);
  if(sc) playScene(sc[0], sc[1], advance, sc[2]); else advance();
}
function check(){
  const st = step(); S.seals = {};
  if(xCheck(st)){ render(); return; }
  if(st.kind==="order"){
    const right = S.p.seq.filter((id,i)=>id===st.answer[i]).length;
    if(right===st.answer.length){ S.p.solved=true; S.p.fb=null; }
    else S.p.fb = `${right} of ${st.answer.length} events are in the right place. Talk about which ones might be out of order, then try again.`;
  }
  if(st.kind==="lock2"||st.kind==="dreidel"){
    const pi = S.p.part||0, part = st.parts[pi];
    if(S.p.val===part.a){ S.p.fb=null; S.p.val=""; S.p.hint=0; if(pi+1<st.parts.length) S.p.part=pi+1; else S.p.solved=true; }
    else { S.p.fb = (part.special && part.special[S.p.val]) || part.wrong; S.p.val=""; }
  }
  if(st.kind==="choice"||st.kind==="split"){
    const o = st.options.find(x=>x[0]===S.p.pick);
    if(o[2]){ S.p.solved=true; S.p.fb=null; } else { S.p.fb=o[3]; S.p.pick=null; }
  }
  if(st.kind==="sort"){
    const right = st.items.filter(it=>S.p.place[it[0]]===it[2]).length;
    if(right===st.items.length){ S.p.solved=true; S.p.fb=null; }
    else S.p.fb = st.books ? `${right} of ${st.items.length} details are in the right book. Read the archive note again and fix the others.` : `${right} of ${st.items.length} are in the right place. Talk it over and fix the others.`;
  }
  if(st.kind==="map"){
    const right = st.labels.filter(l=>S.p.place[l[0]]===l[2]).length;
    if(right===st.labels.length){ S.p.solved=true; S.p.fb=null; }
    else S.p.fb = `${right} of ${st.labels.length} labels are in the right place. Check the notes about the two kingdoms.`;
  }
  if(st.kind==="hunt" || st.kind==="sealq") S.p.solved = true;
  if(st.kind==="menorah"){
    const n = st.night, cand = Object.keys(S.p.cand||{}).map(Number).sort((a,b)=>a-b), want = [...Array(n)].map((_,k)=>8-n+k);
    if(cand.length===n && cand.every((v,k)=>v===want[k])){ S.p.stage=1; S.p.fb=null; S.p.hint=0; }
    else S.p.fb = cand.length!==n ? `Tonight is night ${n}. How many candles go in?` : `Right number, wrong place. Where does the first night's candle go?`;
  }
  render();
}
function forceSolve(){
  const st = step();
  if(xForce(st)) return;
  if(["order","lock2","choice","sort","map","hunt","sealq","menorah"].includes(st.kind) && !S.p.solved){
    if(st.kind==="menorah"){ const n=st.night; S.p.cand={}; for(let k=8-n;k<8;k++) S.p.cand[k]=true; S.p.sh=true; S.p.lit=[...Array(n)].map((_,k)=>8-n+k); S.p.stage=1; }
    if(st.kind==="order") S.p.seq=st.answer.slice();
    if(st.kind==="lock2") S.p.part=st.parts.length-1;
    if(st.kind==="choice") S.p.pick=st.options.find(o=>o[2])[0];
    if(st.kind==="sort"){ if(st.note) S.opened[st.id+"-note"]=true; S.p.place=Object.fromEntries(st.items.map(it=>[it[0],it[2]])); }
    if(st.kind==="map") S.p.place=Object.fromEntries(st.labels.map(l=>[l[0],l[2]]));
    if(st.kind==="hunt") S.p.got=st.order.length;
    S.p.solved=true; S.p.fb=null; render();
  } else if(st.kind==="evidence"){ st.cards.forEach((c,i)=>S.opened[st.id+"-"+i]=true); render(); }
  else next();
}

function playShow(name){
  const slides = SHOWS[name]; let i = 0, timer = null;
  const el = document.createElement("div"); el.className = "show"; el.setAttribute("role","dialog");
  document.body.appendChild(el);
  const draw = () => {
    const s = slides[i];
    el.innerHTML = `<div class="art">${bigArt(s.art, s.art==="question" ? s.n : s.glow, s.open)}</div>
      <p class="cap">${esc(s.cap)}${s.code?`<br><span style="color:#E3B252;letter-spacing:.12em;font-size:1.3em">${GATHER_CODES[s.code]}</span>`:""}</p>
      <div class="ctl"><button class="btn ghost" data-sh="back" ${i===0?"disabled":""}>Back</button>
        <div class="dots">${slides.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
        ${i<slides.length-1?`<button class="btn gold" data-sh="next">Next</button>`:`<button class="btn gold" data-sh="close">Done</button>`}</div>`;
    clearTimeout(timer);
    if(name==="intro" && !s.letter && i<slides.length-1) timer = setTimeout(()=>{ i++; draw(); }, 9000);
  };
  el.addEventListener("click", e=>{
    const b = e.target.closest("[data-sh]"); if(!b) return;
    if(b.dataset.sh==="next"){ i=Math.min(i+1,slides.length-1); draw(); }
    if(b.dataset.sh==="back"){ i=Math.max(i-1,0); draw(); }
    if(b.dataset.sh==="close"){ clearTimeout(timer); el.remove(); }
  });
  draw();
}

/* ================= events ================= */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  if(frozen && !el.closest(".overlay")) return;
  const a = el.dataset.act;
  if(a.startsWith("mc-")) return mcClick(a, el);
  const st = step();
  switch(a){
    case "start": {
      const names = [0,1,2,3].map(i=>$("#nm"+i).value.trim()).filter(Boolean), team = $("#team").value.trim();
      if(names.length<2 || !team){ $("#setupErr").hidden=false; return; }
      S.names = names; S.team = team; next(); break; }
    case "next": next(); break;
    case "switchm": { const m=+el.dataset.m; save(); S = loadGroup(m); store(PICK_KEY, MN); closeLayer(); groupShell(); render(); break; }
    case "pickm": { const m=+el.dataset.m; if(m!==MN){ save(); S = loadGroup(m); store(PICK_KEY, MN); render(); } break; }
    case "open": S.opened[el.dataset.k]=true; render(); break;
    case "speak": speak(el.dataset.text); break;
    case "gloss": {
      const card = el.dataset.k, j=+el.dataset.j;
      const stp = STEPS.find(s=>card.startsWith(s.id+"-")), c = stp.cards[+card.split("-").pop()];
      S.p["g"+card] = `${c.he[j][0]} = ${c.he[j][1]}`;
      const g = document.getElementById("gl-"+card); if(g) g.textContent = S.p["g"+card];
      break; }
    case "hint": S.p.hint=(S.p.hint||0)+1; render(); break;
    case "seal": { const i=+el.dataset.i; S.seals[i]=!S.seals[i]; revealTarget='[data-act="check"]'; render(); break; }
    case "check": check(); break;
    case "place": S.p.seq=(S.p.seq||[]).concat(el.dataset.id); S.seals={}; S.p.fb=null; render(); break;
    case "unplace": S.p.seq=S.p.seq.filter(x=>x!==el.dataset.id); S.seals={}; S.p.fb=null; render(); break;
    case "digit": {
      const d=el.dataset.d, len = st.parts[S.p.part||0].len; S.p.fb=null; S.seals={};
      if(d==="clear") S.p.val=""; else if((S.p.val||"").length<len) S.p.val=(S.p.val||"")+d;
      render(); break; }
    case "pick": S.p.pick=el.dataset.id; S.p.fb=null; S.seals={}; render(); break;
    case "sel": S.p.sel = S.p.sel===el.dataset.id? null : el.dataset.id; render(); break;
    case "bin": if(!S.p.sel) return; S.p.place=Object.assign({},S.p.place,{[S.p.sel]:el.dataset.b}); S.p.sel=null; S.p.fb=null; S.seals={}; render(); break;
    case "resetsort": case "resetmap": S.p.place={}; S.p.sel=null; S.p.fb=null; S.seals={}; render(); break;
    case "region": {
      if(!S.p.sel || S.p.solved) return;
      const pl = Object.assign({}, S.p.place);
      Object.keys(pl).forEach(k=>{ if(pl[k]===el.dataset.r) delete pl[k]; });
      pl[S.p.sel]=el.dataset.r; S.p.place=pl; S.p.sel=null; S.p.fb=null; S.seals={}; render(); break; }
    case "letter": {
      const got=S.p.got||0, want=st.order[got], l=el.dataset.l;
      if(st.crowns[want][1]===l){ S.p.got=got+1; S.p.fb=null; S.p.hint=0; }
      else {
        const k = Object.keys(st.crowns).find(x=>st.crowns[x][1]===l);
        S.p.fb = k==="ROM" ? "That's the crown of Rome. Rome ruled Eretz Yisrael much later, long after the Chanukah story. Try again."
          : `That letter is on the crown of ${st.crowns[k][0]}. ${got? `Who ruled right after ${st.crowns[st.order[got-1]][0]}?` : "Which power ruled first?"} Talk it over and try another crown.`;
      }
      render(); break; }
    case "mh": {
      const i = el.dataset.i, p = S.p;
      if(p.solved) return;
      if((p.stage||0)===0){ if(i==="sh") return; p.cand = Object.assign({}, p.cand); if(p.cand[i]) delete p.cand[i]; else p.cand[i]=true; p.fb=null; S.seals={}; render(); return; }
      if(i==="sh"){ p.sh = true; p.fb=null; render(); return; }
      if(!p.sh){ p.fb = "Light the shamash first. It's the helper light that lights the others."; render(); return; }
      const n = st.night, order = [...Array(n)].map((_,k)=>8-n+k), lit = p.lit||[], nextI = order[lit.length];
      if(+i===nextI){ p.lit = lit.concat(+i); p.fb=null; if(p.lit.length===n) p.solved=true; }
      else p.fb = lit.includes(+i) ? "That one is already lit." : "Not that one yet. Which light is the newest tonight?";
      render(); return; }
    case "flip": S.p.flip=Object.assign({},S.p.flip,{[el.dataset.i]:!(S.p.flip||{})[el.dataset.i]}); render(); break;
    case "gcheck": {
      const v = ($("#gcode").value||"").trim().toUpperCase().replace(/[^A-Z]/g,"");
      if(v===GATHER_CODES[st.n]) next(); else { S.p.fb="That's not the code. Wait for your teacher to show it on the big screen."; render(); }
      break; }
    case "exitpick": { const i=S.p.qi||0; S.exitAns[i]=+el.dataset.j; S.p.qi=i+1; render(); break; }
    case "satchel": cbTab="notes"; openSatchel(); break;
    case "cbtab": cbTab = el.dataset.t; openSatchel(); break;
    case "teacher": openGate("panel"); break;
    case "close": closeLayer(); break;
    case "gate": tryGate(el.dataset.then); break;
    case "freeze": freeze(); break;
    case "skip": closeLayer(); forceSolve(); break;
    case "goto": { const ch=+el.dataset.ch; const idx=STEPS.findIndex(s=>s.ch===ch && s.kind!=="setup"); if(idx>0){ S.step=idx; S.p={}; S.seals={}; } closeLayer(); render(); break; }
    case "reset-ask": $("#resetConfirm").hidden=false; break;
    case "reset": try{localStorage.removeItem(missionKey(MN));}catch(err){} S=fresh(); closeLayer(); groupShell(); render(); break;
  }
});
function mcClick(a, el){
  switch(a){
    case "mc-sel": mcSel = el.dataset.i==="new" ? "new" : +el.dataset.i; renderControl(); setTimeout(()=>{ const f=$("#mcNew")||$("#mcCode"); if(f) f.focus(); },20); break;
    case "mc-checkin": mcCheckin(); break;
    case "mc-cardform": mcCardForm(); break;
    case "mc-cardsend": {
      const c = {group:M.groups[mcSel].name, kingdom:$("#fk") ? $("#fk").value : "Our light", how:$("#fh").value.trim(), fact:$("#ff").value.trim(), src:$("#fs").value.trim(), status:"pending"};
      if(!c.how || !c.fact || !c.src || (MIS.cards!=="light" && !c.kingdom)){ mcErr(MIS.cards==="light" ? "Fill in all three lines before sending." : "Choose an answer in all four boxes before sending."); return; }
      if(MIS.cards!=="light"){ const w = CROWN[c.kingdom]; const bad = ["how","fact","src"].filter((k,j)=>c[k]!==w[["fh","ff","fs"][j]]).length;
        if(bad){ mcErr(`${bad} of your choices ${bad>1?"don't":"doesn't"} belong to ${c.kingdom}. Check your Clue Book and try again.`); return; } }
      M.cards.push(c); mcSel=null; mcSave(); renderControl(); toast(`${c.group}'s ${CL().name} went to the teacher to check.`); break; }
    case "mc-teacher": openGate("mc"); break;
    case "mc-lock": teacherUntil = 0; renderControl(); break;
    case "mc-show": playShow(el.dataset.s); break;
    case "mc-video": playVideo(); break;
    case "mc-view": mcView = el.dataset.v; renderControl(); break;
    case "mc-bonus": openBonus(); break;
    case "mc-bonusdone": M.oil += 2; M.bonusDone++; mcSave(); closeLayer(); renderControl(); toast("Bonus complete: two drops of oil for the class jar!"); break;
    case "mc-bonusother": openBonus(); break;

      c.kingdom=$("#ck"+i).value; c.how=$("#ch"+i).value; c.fact=$("#cf"+i).value; c.src=$("#cs"+i).value; c.status="approved";

    case "mc-mission": mcMission = +el.dataset.m; useMission(mcMission); M = mcLoad(mcMission); mcSel=null; mcView="board"; store(MC_PICK, mcMission); renderControl(); break;
    case "mc-reset": M = mcFresh(); mcSave(); mcSel=null; mcView="board"; renderControl(); break;
  }
}

/* Clue Book: every note the group has opened, by chamber, plus what they discovered. */
function clueEntries(){
  const out = [];
  STEPS.forEach((st, idx) => {
    if(st.cards) st.cards.forEach((c,i)=>{ if(S.opened[st.id+"-"+i]) out.push({ch:st.ch, c}); });
    if(st.note && S.opened[st.id+"-note"]) out.push({ch:st.ch, c:st.note});
    if((st.clue) && S.step > idx) out.push({ch:st.ch, c:st.clue});
    if(st.after && S.step > idx) st.after.forEach(c=>out.push({ch:st.ch, c}));
    if(st.kind==="script" && S.step > idx) out.push({ch:st.ch, c:{t:st.title.replace(/^Read /,"").replace(/ aloud$/,""), src:st.src, b:st.lines.map(l=>st.roles[l[0]][0]+": "+l[1]).join(" ")}});
  });
  return out;
}

  $("#layer").innerHTML = `<div class="overlay"><div class="sheet freeze" role="dialog" aria-label="Paused"><h2>Eyes on your teacher</h2><p class="lead" style="text-align:center">The scroll is paused for a class discussion.</p>
   <div class="keyrow" style="justify-content:center"><input id="tcode" type="password" inputmode="numeric" autocomplete="off" aria-label="Teacher code to resume"><button class="btn" data-act="gate" data-then="unfreeze">Resume</button></div>
   <p class="feedback no" id="tErr" hidden>That code is not right.</p></div></div>`;
}
document.addEventListener("keydown", e=>{
  if(e.key!=="Enter") return;
  if(e.target.id==="tcode"){ const b=document.querySelector('[data-act="gate"]'); if(b) b.click(); }
  if(e.target.id==="mcCode"||e.target.id==="mcNew"){ const b=document.querySelector('[data-act="mc-checkin"]'); if(b) b.click(); }
  if(e.target.id==="gcode"){ const b=document.querySelector('[data-act="gcheck"]'); if(b) b.click(); }
});
window.addEventListener("hashchange", ()=>location.reload());

if(IS_CONTROL){ document.documentElement.classList.add("big"); useMission(mcMission); renderControl(); } else { groupShell(); render(); }
</script>
</body></html>
