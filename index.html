<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>The Sealed Scroll</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Frank+Ruhl+Libre:wght@500;700&family=Marcellus&display=swap" rel="stylesheet">
<style>
/* Layout: a sealed-scroll header with six wax seals, a row of chamber stones, one stone-tablet stage. #control = the class big screen. */
:root{
  --bg:#E6E3DB; --panel:#F7F5F0; --panel-2:#EFECE4; --ink:#1C2333; --muted:#596072; --line:#CEC8BA;
  --lapis:#2B4C8C; --lapis-soft:#DDE5F3; --on-accent:#FFFFFF;
  --gold:#9C6B10; --gold-soft:#F2E5C6; --flame:#E39A2B;
  --ok:#2E6A3E; --ok-soft:#DCEBDD; --warn:#9A3A2A; --warn-soft:#F5DFD9;
  --sea:#C9D6E6; --land:#E2D9C4; --land-2:#D6CBB0; --night:#151B2A; --night-2:#232C40; --stone:#B9AF9A; --stone-2:#9C927C;
  --s0:#2B4C8C; --s1:#5A6A1F; --s2:#9B2D3A; --s3:#9C6B10;
  --display:'Marcellus', Georgia, 'Times New Roman', serif;
  --body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --heb:'Frank Ruhl Libre', 'Times New Roman', serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10151E; --panel:#19202E; --panel-2:#212A3B; --ink:#ECE8DF; --muted:#A4AABA; --line:#313B4E;
  --lapis:#8EAEF0; --lapis-soft:#22304D; --on-accent:#0F131B;
  --gold:#E3B252; --gold-soft:#3A2F17; --flame:#F2B04A;
  --ok:#82C894; --ok-soft:#1C3324; --warn:#F09C88; --warn-soft:#3E231E;
  --sea:#1F3550; --land:#3A3426; --land-2:#4A4230; --night:#0A0E16; --night-2:#1A2233; --stone:#4C4638; --stone-2:#3A3529;
  --s0:#7B9DE6; --s1:#A9B85A; --s2:#E27583; --s3:#E3B252;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#10151E; --panel:#19202E; --panel-2:#212A3B; --ink:#ECE8DF; --muted:#A4AABA; --line:#313B4E;
  --lapis:#8EAEF0; --lapis-soft:#22304D; --on-accent:#0F131B;
  --gold:#E3B252; --gold-soft:#3A2F17; --flame:#F2B04A;
  --ok:#82C894; --ok-soft:#1C3324; --warn:#F09C88; --warn-soft:#3E231E;
  --sea:#1F3550; --land:#3A3426; --land-2:#4A4230; --night:#0A0E16; --night-2:#1A2233; --stone:#4C4638; --stone-2:#3A3529;
  --s0:#7B9DE6; --s1:#A9B85A; --s2:#E27583; --s3:#E3B252;
  color-scheme:dark; }

*{box-sizing:border-box}
html{font-size:18px}
html.big{font-size:clamp(18px,1.3vw,30px)}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.5;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 40px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.wrap.wide{max-width:1400px}

.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:var(--display);font-size:1.5rem;letter-spacing:.04em;margin:0;font-weight:400}
.brand small{display:block;font-family:var(--body);font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.seals{display:flex;gap:6px;align-items:center}
.wax{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:.85rem;border:2px solid var(--line);color:var(--muted);background:var(--panel)}
.wax.active{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.wax.open{background:var(--gold);border-color:var(--gold);color:var(--on-accent)}
.tools{display:flex;gap:8px}
.chip-btn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:.9rem;cursor:pointer;min-height:44px}

.track{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stone{background:var(--panel-2);border-radius:8px;padding:6px 8px;font-size:.78rem;color:var(--muted);text-align:center;border:1px solid transparent;min-width:0}
.stone b{display:block;font-family:var(--display);font-size:.95rem;font-weight:400}
.stone.now{border-color:var(--lapis);color:var(--ink);background:var(--lapis-soft)}
.stone.done{color:var(--ok)}
@media (max-width:560px){ .stone span{display:none} }

.stage{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,4vw,32px);display:flex;flex-direction:column;gap:18px;min-width:0}
.eyebrow{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:0}
h2{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,4.5vw,2.2rem);line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0}
p{margin:0}
.lead{font-size:1.08rem;max-width:62ch}
.muted{color:var(--muted)}
.driver{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;color:var(--muted);flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}

.btn{border:none;border-radius:12px;padding:12px 20px;min-height:52px;font-weight:700;cursor:pointer;background:var(--lapis);color:var(--on-accent);font-size:1.02rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:var(--on-accent)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* room-action banner: something to do away from the tablet */
.action{border:2px solid var(--gold);background:var(--gold-soft);border-radius:14px;padding:16px;display:flex;gap:14px;align-items:flex-start}
.action svg{flex:none;width:46px;height:46px}
.action h4{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:1.25rem}
.action ol,.action ul{margin:6px 0 0;padding-left:1.2em}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.sealed{background:var(--panel-2);cursor:pointer;align-items:flex-start;text-align:left;min-height:120px;justify-content:center;border-style:dashed}
.card .for{font-size:.82rem;font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card h4{font-family:var(--display);font-weight:400;font-size:1.15rem;margin:0}
.card .yr{font-variant-numeric:tabular-nums;color:var(--gold);font-weight:700}
.aloud-tag{font-size:.78rem;font-weight:700;color:var(--s2);text-transform:uppercase;letter-spacing:.08em}
.say-btn{align-self:flex-start;border:1px solid var(--line);background:transparent;border-radius:999px;padding:6px 12px;font-size:.85rem;cursor:pointer;min-height:40px}
.he{direction:rtl;font-family:var(--heb);font-size:1.6rem;line-height:1.9;display:flex;flex-wrap:wrap;gap:4px 8px}
.he button{font-family:var(--heb);font-size:1.6rem;border:none;background:var(--gold-soft);border-radius:8px;padding:0 8px;cursor:pointer}
.gloss{font-size:.95rem;color:var(--gold);min-height:1.5em}

.ritual{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.sealrow{display:flex;flex-wrap:wrap;gap:14px}
.seal{display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;cursor:pointer;min-width:72px}
.seal i{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:1.5rem;border:3px dashed currentColor}
.seal.on i{background:currentColor}
.seal.on i span{color:var(--on-accent)}
.seal small{font-size:.85rem;color:var(--ink)}

.slots{display:flex;flex-direction:column;gap:8px}
.slot{display:flex;gap:10px;align-items:center;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;min-height:52px}
.slot .n{font-family:var(--display);color:var(--gold);width:1.5em;flex:none}
.tile{border:1px solid var(--line);background:var(--panel-2);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;min-height:48px;font-size:1rem}
.tile.sel{border:2px solid var(--lapis);background:var(--lapis-soft)}
.slot .tile{flex:1;background:var(--lapis-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.feedback{border-radius:10px;padding:12px 14px;font-weight:700}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.no{background:var(--warn-soft);color:var(--warn)}
.feedback.info{background:var(--gold-soft);color:var(--ink);font-weight:400}
.hintbox{background:var(--panel-2);border-radius:10px;padding:10px 14px;font-size:.98rem}

.lock{display:flex;flex-direction:column;align-items:flex-start;gap:12px}
.dial{font-family:var(--display);font-size:2.4rem;letter-spacing:.2em;font-variant-numeric:tabular-nums;border:2px solid var(--gold);border-radius:12px;padding:4px 18px;min-width:5ch;text-align:center;min-height:68px}
.pad{display:grid;grid-template-columns:repeat(5,56px);gap:8px}
.pad button{height:56px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);font-size:1.3rem;cursor:pointer}
.part{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted)}

.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel-2);cursor:pointer;min-height:52px;font-size:1rem}
.choice.picked{border:2px solid var(--lapis)}

.bins{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.bin{border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:left;min-width:0;padding:0}
.bin svg{width:100%;height:auto;display:block}
.bin .inbook{display:flex;flex-direction:column;gap:6px;padding:0 4px}
.bin.armed svg .cover{stroke:var(--lapis);stroke-width:4}
.bins.plain{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.pbin{border:2px dashed var(--line);border-radius:12px;padding:12px;min-height:130px;display:flex;flex-direction:column;gap:8px;cursor:pointer;background:transparent;text-align:left;min-width:0}
.pbin h4{margin:0;font-family:var(--display);font-weight:400;font-size:1.2rem}
.pbin small{color:var(--muted);font-size:.85rem;margin-top:-6px}
.pbin.armed{border-color:var(--lapis);background:var(--lapis-soft)}
@media (max-width:520px){ .bins{grid-template-columns:1fr} }

.mapbox{overflow-x:auto}
.mapbox svg{width:100%;max-width:640px;height:auto;max-height:58vh;display:block}
.region{fill:var(--land-2);stroke:var(--panel);stroke-width:3;cursor:pointer}
.region.tagged{fill:var(--gold-soft);stroke:var(--gold)}
.maptext{fill:var(--ink);font-family:var(--body);font-size:13px;pointer-events:none;font-weight:700}
.seatext{fill:var(--muted);font-family:var(--body);font-size:13px;font-style:italic;pointer-events:none}

.letters{direction:rtl;display:flex;gap:10px;flex-wrap:wrap}
.letters span{width:56px;height:64px;border:2px solid var(--gold);border-radius:10px;display:grid;place-items:center;font-family:var(--heb);font-size:2.2rem;color:var(--gold)}
.letterpad{direction:rtl;display:flex;gap:10px;flex-wrap:wrap}
.letterpad button{width:64px;height:64px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);font-family:var(--heb);font-size:2rem;cursor:pointer}

.script{display:flex;flex-direction:column;gap:10px}
.line{border-left:4px solid var(--line);padding:6px 12px}
.line.speak{border-color:var(--s2)}
.line .who{font-weight:700;font-size:.9rem;display:flex;gap:6px;align-items:center}
.line.stage{font-style:italic;color:var(--muted);border-color:transparent}

.codeword{font-family:var(--display);font-size:clamp(2.2rem,8vw,3.4rem);letter-spacing:.12em;color:var(--gold);border:2px dashed var(--gold);border-radius:14px;padding:6px 20px;align-self:flex-start}
.flip{border:1px solid var(--line);border-radius:12px;padding:16px;min-height:90px;background:var(--panel-2);cursor:pointer;text-align:left;width:100%}
.flip b{display:block;margin-bottom:4px}

.roles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.role{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:4px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field input,.field textarea,.field select{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);min-height:50px;width:100%}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}

.overlay{position:fixed;inset:0;background:rgba(10,14,22,.72);display:grid;place-items:center;z-index:50;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.sheet{background:var(--panel);color:var(--ink);border-radius:16px;padding:22px;max-width:640px;width:100%;max-height:100%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.freeze h2{font-size:clamp(2rem,7vw,3.2rem);text-align:center}
.keyrow{display:flex;gap:8px;flex-wrap:wrap}
.keyrow input{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);width:9ch}
.tkey{background:var(--panel-2);border-radius:10px;padding:12px;font-size:.98rem}
.tkey b{color:var(--gold)}
.foot{display:flex;justify-content:flex-end}
.foot button{background:none;border:none;color:var(--muted);font-size:.85rem;cursor:pointer;padding:8px;min-height:44px}

/* ===== scenes (transitions + big-screen animations) ===== */
.scene{position:fixed;inset:0;z-index:60;background:var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;cursor:pointer;
  padding:max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.scene svg{width:min(92vw,720px);height:auto;max-height:68vh}
.scene .cap{font-family:var(--display);color:#F2E5C6;font-size:clamp(1.4rem,4vw,2.2rem);text-align:center;text-wrap:balance;max-width:28ch}
.scene .skip{color:#A4AABA;font-size:.85rem}
.ink-gold{fill:#E3B252}.ink-gold-s{stroke:#E3B252}
@keyframes leafL{to{transform:perspective(600px) rotateY(-80deg)}}
@keyframes leafR{to{transform:perspective(600px) rotateY(80deg)}}
@keyframes rise{to{transform:translateY(-150px)}}
@keyframes shackle{0%{transform:translateY(0)}50%{transform:translateY(-22px)}100%{transform:translateY(-22px) rotate(-35deg)}}
@keyframes sun{from{transform:translateY(90px)}to{transform:translateY(0)}}
@keyframes skyfade{from{opacity:.2}to{opacity:1}}
@keyframes splitL{to{transform:translateX(-90px) rotate(-8deg)}}
@keyframes splitR{to{transform:translateX(90px) rotate(8deg)}}
@keyframes crackL{to{transform:translate(-60px,30px) rotate(-30deg);opacity:0}}
@keyframes crackR{to{transform:translate(60px,30px) rotate(30deg);opacity:0}}
@keyframes unroll{from{transform:scaleX(.05)}to{transform:scaleX(1)}}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 2px #E3B252)}50%{filter:drop-shadow(0 0 22px #F2B04A)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.1);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes flicker{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.15)}}
@keyframes walk{from{transform:translateX(0)}to{transform:translateX(330px)}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes fill{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.a-leafL{transform-box:fill-box;transform-origin:left center;animation:leafL 1.6s .3s ease-in-out forwards}
.a-leafR{transform-box:fill-box;transform-origin:right center;animation:leafR 1.6s .3s ease-in-out forwards}
.a-rise{animation:rise 1.8s .3s ease-in-out forwards}
.a-shackle{transform-box:fill-box;transform-origin:right bottom;animation:shackle 1.6s .3s ease-out forwards}
.a-sun{animation:sun 2s ease-out forwards}
.a-sky{animation:skyfade 2s ease-out forwards}
.a-splitL{transform-box:fill-box;transform-origin:center;animation:splitL 1.6s .4s ease-in-out forwards}
.a-splitR{transform-box:fill-box;transform-origin:center;animation:splitR 1.6s .4s ease-in-out forwards}
.a-crackL{transform-box:fill-box;transform-origin:center;animation:crackL 1.4s .5s ease-in forwards}
.a-crackR{transform-box:fill-box;transform-origin:center;animation:crackR 1.4s .5s ease-in forwards}
.a-unroll{transform-box:fill-box;transform-origin:center;animation:unroll 1.6s ease-out forwards}
.a-glow{animation:glow 1.4s ease-in-out infinite}
.a-pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .6s ease-out forwards}
.a-flicker{transform-box:fill-box;transform-origin:bottom center;animation:flicker .5s ease-in-out infinite}
.a-walk{animation:walk 5s linear forwards}
.a-fade{opacity:0;animation:fadein .8s ease-out forwards}
.a-fill{transform-box:fill-box;transform-origin:bottom;animation:fill 2s ease-out forwards}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}}

/* ===== Mission Control (big screen) ===== */
.mc{font-size:1.1rem}
.mc .btn{font-size:1.1rem;min-height:3rem}
.mc .lamp svg{width:3rem;height:2.3rem}
.mc .lamp{font-size:.8rem}
.mc-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.mc-head h1{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,3vw,2.6rem);margin:0}
.mc-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){ .mc-grid{grid-template-columns:1fr} }
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.grp{display:grid;grid-template-columns:minmax(0,1.4fr) repeat(var(--lamps,5),minmax(0,1fr));gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.grp:last-child{border-bottom:none}
.grp .gname{font-weight:700;font-size:1.15rem;overflow-wrap:anywhere}
.lamp{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.75rem;color:var(--muted)}
.lamp svg{width:44px;height:34px}
.lamp.lit{color:var(--ink)}
.jar svg{width:100%;max-width:220px;height:auto;display:block;margin:0 auto}
.bigbtns{display:flex;flex-wrap:wrap;gap:10px}
.toast{position:fixed;left:50%;top:calc(20px + env(safe-area-inset-top, 0px));transform:translateX(-50%);background:var(--gold);color:var(--on-accent);padding:14px 24px;border-radius:14px;font-weight:700;font-size:1.3rem;z-index:70;animation:pop .5s ease-out forwards;max-width:calc(100vw - 32px)}
.show{position:fixed;inset:0;z-index:55;background:var(--night);color:#ECE8DF;display:flex;flex-direction:column;
  padding:max(20px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px))}
.show .art{flex:1;display:grid;place-items:center;min-height:0}
.show .art svg{width:min(94vw,1000px);height:auto;max-height:58vh}
.show .cap{font-family:var(--display);font-size:clamp(1.6rem,3.6vw,3rem);text-align:center;text-wrap:balance;max-width:34ch;margin:0 auto;min-height:3em}
.show .ctl{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}
.show .btn.ghost{color:#ECE8DF;border-color:#3A4458}
.show .dots{display:flex;gap:6px}
.show .dots i{width:10px;height:10px;border-radius:50%;background:#3A4458}
.show .dots i.on{background:#E3B252}
.cardwall{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}

/* Short transition scene on a tablet. Plays, then calls cb. Tap to skip. */
function playScene(name, caption, cb, arg){
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const el = document.createElement("div");
  el.className = "scene"; el.setAttribute("role","dialog"); el.setAttribute("aria-label", caption);
  el.innerHTML = `${ART[name](arg)}<p class="cap">${esc(caption)}</p><p class="skip">Tap to continue</p>`;
  document.body.appendChild(el);
  let done = false;
  const finish = () => { if(done) return; done = true; el.remove(); cb && cb(); };
  el.addEventListener("click", finish);
  setTimeout(finish, reduce ? 900 : 2600);
}

 {id:"c3-ev", ch:3, kind:"evidence", enter:["door","Chamber 3: The King Who Bowed"], eyebrow:"Chamber 3 · The King Who Bowed",

  cards:[

  key:"No answer: both scenes opened.", teaches:"Persian rule ends with Alexander (3448)."},
 {id:"c3-act", ch:3, kind:"act", enter:["dawn","Dawn at Antipatris"], eyebrow:"Chamber 3 · The King Who Bowed",
  title:"Act it out: dawn at Antipatris",

 {id:"c3-choice", ch:3, kind:"choice", eyebrow:"Chamber 3 · The King Who Bowed",
  title:"You are Shimon HaTzaddik",
  lead:"Another account says Alexander toured the Beis Hamikdash. He offered gold to put up a statue of himself there, so he would be remembered forever. Talk it over: what should Shimon HaTzaddik answer?",
  options:[
   ["a","Yes. Alexander saved the Beis Hamikdash, so we owe him this.", false, "A statue (a carved image) may not be made, and certainly not in the Beis Hamikdash. Try again."],
   ["b","No, and send him away quickly so he can't ask again.", false, "Shimon HaTzaddik was thankful to Alexander, and an angry answer could put the Jews in danger. Is there a way to honor him without breaking the Torah?"],
   ["c","Give the gold to the poor, and name the baby boys born this year Alexander to honor him.", true, "That is what Shimon HaTzaddik suggested. It keeps the Torah and shows real thanks. That's why Alexander became a Jewish name."]],

  key:"C: give the gold to the poor and name baby boys Alexander.", teaches:"Gratitude without compromising halacha."},
 {id:"c3-sort", ch:3, kind:"sort", eyebrow:"Chamber 3 · Source Detective",
  title:"Which book tells which part?",
  lead:"Historians always ask: where does this detail come from? Read the archive note, then tap a detail and tap the book it belongs in.",

  items:[["k","The Kutim tell Alexander the Jews are rebels","G"],["w","Shimon HaTzaddik walks all night with torches","G"],["v","Alexander bows and tells about the face he sees in battle","G"],["s","Alexander asks for a statue in the Beis Hamikdash","Y"],["n","Baby boys are named Alexander","Y"]],
  hints:["Only one person in your group has the archive note. Ask them to read it again, slowly.","Everything up to and including the bowing is in the Gemara."],
  win:"Sources sorted. Now you know which parts come from the Gemara and which from a later book.",
  satchel:["Crown: Alexander of Greece ended Persian rule (3448)","Source: Alexander bowing is in the Gemara, Yoma 69a; the name Alexander comes from Sefer Yosippon"],
  key:"Gemara: Kutim, night walk, bowing. Yosippon: statue, name Alexander.", teaches:"A Torah source vs. a later historical work."},
 {id:"c3-say", ch:3, kind:"say", prompt:"Explain to your group: why did Alexander bow, and why does it matter which book a detail comes from?",
  key:"He saw Shimon HaTzaddik's face leading him in battle. The source tells us how old and how reliable a detail is.", teaches:"Oral check."},

 {id:"c4-ev", ch:4, kind:"evidence", enter:["split","Chamber 4: The Broken Empire"], eyebrow:"Chamber 4 · The Broken Empire",

 {id:"c4-ev2", ch:4, kind:"evidence", eyebrow:"Chamber 4 · The Broken Empire",
  title:"Who ruled first?",
  lead:"Three more notes tell what happened to Eretz Yisrael between the two kingdoms.",
  cards:[

   {t:"A Hard Day", aloud:true, b:"Our Sages said the day the Torah was put into Greek was as hard for the Jews as the day the Golden Calf was made. A translation cannot hold everything the Torah means, and others could misunderstand it.", src:"Maseches Sofrim 1:7"},

 {id:"c4-check", ch:4, kind:"checkin", key:"Runner checks in with ANTIOCH.", teaches:"Movement + class tracking."},

/* ================= Mission 2: The Greeks and the Decrees ================= */

const POSTERS_M2 = ["Shabbos","Bris Milah","Rosh Chodesh","The Torah","The Beis Hamikdash and Kashrus"];
const STEPS_M2 = [

 {id:"m2-c1-ev", ch:1, kind:"evidence", enter:["door","Chamber 1: The Gymnasium"], eyebrow:"Chamber 1 · The Gymnasium",
  title:"A new kind of life in Yerushalayim",
  lead:"Antiochus IV now ruled Eretz Yisrael, and Greek ways were everywhere. Open your own note, read it yourself, and tell your group what it says.",
  cards:[
   {t:"A Dazzling World", tts:true, b:"The Greeks built beautiful cities, theaters and stadiums. They were famous for mathematics, science and philosophy, and for their sports contests. King Antiochus IV wanted his whole empire to live the Greek way."},
   {t:"Greek Names, Greek Ways", aloud:true, b:"Some Jews began to use Greek names, dress like Greeks and follow Greek ideas instead of the Torah. They were called mityavnim, Hellenists. Many other Jews held on to the Torah."},
   {t:"A Bought Office", b:"The Kohen Gadol was a righteous man named Chonyo. His brother Yehoshua, who liked the Greek name Jason, paid King Antiochus IV a huge bribe. The king made Jason Kohen Gadol in Chonyo's place."},
   {t:"A Gymnasium Near Har HaBayis", b:"Jason built a gymnasium, a Greek sports hall, close to Har HaBayis. Many Kohanim and young Jews went to the games, which included offerings to Greek gods."},
   {t:"Outbid", b:"Then Menelaus, who may not even have been a Kohen, paid the king even more money and took the job of Kohen Gadol away from Jason."}
  ],
  key:"No answer: every note opened.", teaches:"Hellenism's attraction; the mityavnim; Jason, the gymnasium, Menelaus (Chabad.org, The Events Before and After the Chanukah Miracle)."},
 {id:"m2-c1-who", ch:1, kind:"sort", eyebrow:"Chamber 1 · The Gymnasium",
  title:"Who's who in Yerushalayim?",
  lead:"Tap a description, then tap the person it describes. Some people get more than one.",
  bins:[["CH","Chonyo","the Kohen Gadol"],["JA","Jason","Yehoshua"],["ME","Menelaus",""],["AN","Antiochus IV","the king"]],
  items:[["a","The righteous Kohen Gadol who was pushed out","CH"],["b","Liked his Greek name better than his Hebrew one","JA"],["c","Built a gymnasium near Har HaBayis","JA"],["d","Paid even more, and may not even have been a Kohen","ME"],["e","Sold the office of Kohen Gadol to the highest bidder","AN"],["f","Wanted his whole empire to live the Greek way","AN"]],
  hints:["Each note names one person. Ask the owner of each note to read it again.","Jason gets two descriptions, and so does the king."],
  win:"Sorted. The holiest job in the Beis Hamikdash had become something you could buy.",
  satchel:["Jason (Yehoshua) bought the office of Kohen Gadol and built a gymnasium near Har HaBayis"],
  key:"Chonyo: a. Jason: b, c. Menelaus: d. Antiochus IV: e, f.", teaches:"Who the main figures were."},
 {id:"m2-c1-say", ch:1, kind:"say", prompt:"Explain to your group: why were some Jews drawn to Greek ways, and what did Jason do with the job of Kohen Gadol?",
  key:"Greek culture was impressive and popular; Jason bought the office and built a gymnasium.", teaches:"Oral check."},
 {id:"m2-c1-check", ch:1, kind:"checkin", key:"Runner checks in with CHONYO.", teaches:"Movement + class tracking."},

 /* ---------- Chamber 2: The Decree Wall ---------- */
 {id:"m2-c2-walk", ch:2, kind:"room", enter:["door","Chamber 2: The Decree Wall"], eyebrow:"Chamber 2 · The Decree Wall", title:"Read the Decree Wall",
  body:()=>{
    const rows = POSTERS_M2.map((p,i)=>`<li><b>Poster ${i+1}: ${esc(p)}</b> · ${tag(i)}</li>`).join("");
    return action(ICON_WALK,"Each of you walks to your own posters",`<p>King Antiochus sent out decrees: orders that every town had to obey. Five posters around the room show what they said. Go to your own posters, read them yourself, then come back and tell your group what they say.</p><ul style="list-style:none;padding:0;margin-top:8px;display:flex;flex-direction:column;gap:4px">${rows}</ul>`);
  },
  cta:"We read every poster", key:"Physical: five Decree Wall posters around the room.", teaches:"The decrees and how they changed daily Jewish life."},
 {id:"m2-c2-sort", ch:2, kind:"sort", eyebrow:"Chamber 2 · The Decree Wall",
  title:"What did the decrees forbid?",
  lead:"Talk it over with what you read on the posters. Tap each item, then tap where it belongs.",
  bins:[["W","On the Decree Wall","forbidden by the decrees"],["N","Not on the Wall",""]],
  items:[["s","Keeping Shabbos","W"],["m","Giving a baby a bris milah","W"],["r","Declaring Rosh Chodesh","W"],["t","Owning and learning a Sefer Torah","W"],["k","Eating only kosher food","W"],["c","Lighting Chanukah candles","N"],["l","Eating latkes","N"]],
  hints:["Only one person read each poster. Ask each of them what their poster said.","Two of these didn't exist yet. Think: when did Chanukah begin?"],
  win:"Right. And Chanukah candles and latkes weren't forbidden, because Chanukah didn't exist yet. It began because of what happened next.",
  satchel:["The decrees forbade Shabbos, bris milah, Rosh Chodesh, the Torah, and kosher food; idols were put in the Beis Hamikdash"],
  key:"On the Wall: Shabbos, bris milah, Rosh Chodesh, Sefer Torah, kosher food. Not on the Wall: Chanukah candles, latkes.", teaches:"The mitzvos the decrees targeted (Megillas Antiochus; Chabad.org)."},
 {id:"m2-c2-choice", ch:2, kind:"choice", eyebrow:"Chamber 2 · The Decree Wall",
  title:"The puzzle of Rosh Chodesh",
  lead:"The poster about Rosh Chodesh gives a clue. Why would banning Rosh Chodesh hurt every Yom Tov of the year?",
  options:[
   ["a","Because Rosh Chodesh is the most important Yom Tov of the year.", false, "Rosh Chodesh is special, but not the most important. Read the Rosh Chodesh poster again: what depends on it?"],
   ["b","Because without the new month being declared, no one would know on which day Pesach, Shavuos or Sukkos falls.", true, "Exactly. The Sanhedrin's announcement of the new month set the date of every Yom Tov. No Rosh Chodesh means no Jewish calendar."],
   ["c","Because the Greeks didn't like the moon.", false, "That's not what the poster says. Think about what the Jewish calendar needs."]],

  key:"B: without Rosh Chodesh, no one would know when the Yomim Tovim fall.", teaches:"Why the Rosh Chodesh decree struck at all of Jewish time."},
 {id:"m2-c2-say", ch:2, kind:"say", prompt:"Explain to your group: how would one week of Jewish life change under these decrees?",
  key:"No Shabbos, no Torah learning, no bris, no calendar, forced to eat non-kosher.", teaches:"Oral check."},
 {id:"m2-c2-check", ch:2, kind:"checkin", key:"Runner checks in with SHABBOS.", teaches:"Movement + class tracking."},

  note:{to:2, t:"Archive note: three kinds of pressure", b:"Political rule: a foreign king is in charge, collects taxes and appoints officials. Cultural influence: new ideas, names, fashions and games that pull people toward a different way of life. Religious persecution: people are forced to stop keeping mitzvos, or to serve idols."},
  bins:[["P","Political rule",""],["C","Cultural influence",""],["R","Religious persecution",""]],
  items:[["p1","A foreign king collects heavy taxes","P"],["p2","The king appoints officials to run the land","P"],["c1","A gymnasium is built near Har HaBayis","C"],["c2","Jews start using Greek names","C"],["c3","Greek games and fashions become popular","C"],["r1","Keeping Shabbos is forbidden","R"],["r2","Sifrei Torah are taken away and burned","R"],["r3","Idols are set up in the Beis Hamikdash","R"]],
  hints:["Ask: is this about who is in charge, about what people like, or about forcing people to stop serving Hashem?","The gymnasium tempted people, but nobody was forced to go. That makes it influence, not persecution."],
  win:"Sorted. The Jews had lived under foreign kings for hundreds of years. Greek influence pulled some Jews away. But persecution was something new.",
  key:"Political: taxes, officials. Cultural: gymnasium, Greek names, games and fashions. Religious persecution: Shabbos forbidden, Sifrei Torah burned, idols in the Beis Hamikdash.", teaches:"The difference between rule, influence and persecution."},
 {id:"m2-c3-choice", ch:3, kind:"choice", eyebrow:"Chamber 3 · Three Kinds of Pressure",
  title:"What finally made them fight?",
  lead:"In Mission 1 you found a clue: Bavel, Persia, Alexander and the Ptolemies all ruled the Jews, and the Jews did not rebel. Which kind of pressure finally made them fight?",
  options:[
   ["a","Political rule: foreign kings and their taxes.", false, "The Jews had lived under foreign kings for hundreds of years without rebelling. Look at your Satchel from Mission 1."],
   ["b","Cultural influence: the gymnasium and Greek ways.", false, "Greek influence split the Jews and was dangerous, but anyone could still choose to keep the Torah. Something else changed."],
   ["c","Religious persecution: being forbidden to keep the Torah.", true, "Yes. When keeping the Torah itself was forbidden, the Jews were ready to stand up, even against a mighty king."]],
  hints:["Think about the clue from the end of Mission 1.","What was different about Antiochus IV compared to the kings before him?"],

 {id:"m2-c3-say", ch:3, kind:"say", prompt:"Explain to your group: what is the difference between a king who rules you and a king who forbids the Torah?",
  key:"Foreign rule they accepted; being forced to abandon the Torah they would not accept.", teaches:"Oral check."},

const MISSIONS = {
  1: {title:"Before the Chanukah Story", question:"Who was ruling the Yidden when the Chanukah story began, and how did they come under that rule?",
      chambers:CHAMBERS_M1, driver:DRIVER_ROLE_M1, codes:CHECK_CODES_M1, gather:GATHER_CODES_M1, steps:STEPS_M1, sealStep:"c5-hunt", lamps:5,
      checkin:{KORESH:1, SHIVIM:2, SHIVEEM:2, SEVENTY:2, SHIMON:3, ANTIOCH:4, CHANUKAH:5, HANUKKAH:5, CHANUKA:5}, shows:["intro","g1","g2"], cards:true},
  2: {title:"The Greeks and the Decrees", question:"What changed in Jewish life, and why did it lead to rebellion?",
      chambers:CHAMBERS_M2, driver:{1:0, 2:2, 3:3, 4:1}, codes:{1:"CHONYO", 2:"SHABBOS", 3:"MIKDASH", 4:"MODIIN"}, gather:{}, steps:STEPS_M2, sealStep:"m2-seal", lamps:4,
      checkin:{CHONYO:1, SHABBOS:2, SHABBAT:2, MIKDASH:3, MODIIN:4, MODIN:4}, shows:["intro2"], cards:false}
};

/* ================= group state ================= */
function fresh(){return {team:"", names:[], step:0, opened:{}, satchel:[], p:{}, seals:{}, exitAns:{}, done:{}};}
function load(k){try{const s=JSON.parse(localStorage.getItem(k)); if(s) return s;}catch(e){} return null;}
function store(k,v){try{localStorage.setItem(k, JSON.stringify(v));}catch(e){}}
const missionKey = n => n===1 ? KEY_BASE : KEY_BASE + "-m" + n;
function useMission(n){
  MN = MISSIONS[n] ? n : 1; MIS = MISSIONS[MN];
  CHAMBERS = MIS.chambers; DRIVER_ROLE = MIS.driver; CHECK_CODES = MIS.codes; GATHER_CODES = MIS.gather || {}; STEPS = MIS.steps;
}
function loadGroup(n){ useMission(n); const s=load(missionKey(MN)); const g = s && Array.isArray(s.names) ? s : fresh(); if(g.done && g.done.seal1) g.done.seal = true; return g; }
let S = loadGroup(+(load(PICK_KEY)||1));
let frozen = false;
const save = () => { store(missionKey(MN), S); store(PICK_KEY, MN); };
const N = () => Math.max(1, S.names.length);
const ix = i => ((i % N()) + N()) % N();
const nm = i => S.names[ix(i)] || "Investigator";
const col = i => `var(--s${ix(i)})`;
const tag = i => `<span class="dot" style="background:${col(i)}"></span>${esc(nm(i))}`;
const step = () => STEPS[S.step];
function driverIndex(ch){ return DRIVER_ROLE[ch]!==undefined ? DRIVER_ROLE[ch] % N() : ch % N(); }
function rolesFor(i){ return ROLES.filter((r,ri)=> ri % N() === i); }

/* ================= group chrome ================= */
function groupShell(){
  $("#app").className = "wrap";
  $("#app").innerHTML = `
  <header class="top">
    <h1 class="brand"><small>Chanukah: Unlock the Story</small>The Sealed Scroll</h1>
    <div class="seals" id="seals" aria-label="Six seals"></div>
    <div class="tools"><button class="chip-btn" data-act="satchel" id="satchelBtn">Satchel</button></div>
  </header>
  <nav class="track" id="track" aria-label="Chambers"></nav>
  <main class="stage" id="stage" aria-live="polite"></main>
  <div class="foot"><button data-act="teacher">Teacher</button></div>`;
}
function drawChrome(){
  const st = step();
  $("#seals").innerHTML = [1,2,3,4,5,6].map(i=>{
    const open = i < MN || (i===MN && S.done.seal), active = (i===MN && !open) || (i===MN+1 && S.done.seal);
    return `<span class="wax ${open?"open":""} ${active?"active":""}" title="Seal ${i}">${i}</span>`;}).join("");
  $("#track").style.gridTemplateColumns = `repeat(${CHAMBERS.length-1},1fr)`;
  $("#track").innerHTML = CHAMBERS.slice(1).map((c,i)=>{const ch=i+1, cls = st.ch>ch?"done":st.ch===ch?"now":""; return `<div class="stone ${cls}"><b>${ch}</b><span>${c.n}</span></div>`;}).join("");
  $("#satchelBtn").textContent = `Satchel (${S.satchel.length})`;
  $("#satchelBtn").hidden = S.step===0;
}

/* ================= shared widgets ================= */
function driverLine(ch){
  if(ch<1 || ch===5) return "";
  return `<p class="driver">At the screen: ${tag(driverIndex(ch))} · everyone else guides</p>`;
}
function hintBlock(hs){
  const n = S.p.hint||0; hs = hs||[];
  if(!hs.length) return "";
  let h = hs.slice(0,n).map((t,i)=>`<div class="hintbox"><b>Hint ${i+1}.</b> ${esc(t)}</div>`).join("");
  if(n < hs.length) h += `<div><button class="btn ghost" data-act="hint">${n? "Another hint":"Need a hint?"}</button></div>`;
  return h;
}
function ritual(label){
  const all = S.names.every((_,i)=>S.seals[i]);
  return `<div class="ritual">
    <p><b>Seal your answer.</b> Each investigator taps their own seal only if they agree. If someone disagrees, talk it out first.</p>
    <div class="sealrow">${S.names.map((n,i)=>`<button class="seal ${S.seals[i]?"on":""}" style="color:${col(i)}" data-act="seal" data-i="${i}" aria-pressed="${!!S.seals[i]}"><i><span>${esc(n.charAt(0).toUpperCase())}</span></i><small>${esc(n)}</small></button>`).join("")}</div>
    <div><button class="btn" data-act="check" ${all?"":"disabled"}>${label||"Check"}</button></div></div>`;
}
const winBlock = text => `<div class="feedback ok">${esc(text)}</div><div><button class="btn gold" data-act="next">Continue</button></div>`;
function cardHTML(c, owner, key){
  if(!S.opened[key]) return `<button class="card sealed" data-act="open" data-k="${key}"><span class="for">For ${tag(owner)}</span><span class="muted">Sealed note. ${esc(nm(owner))}, tap to open it.</span></button>`;
  let he = "";
  if(c.he) he = `<div class="he" lang="he">${c.he.map((w,j)=>`<button data-act="gloss" data-k="${key}" data-j="${j}">${w[0]}</button>`).join("")}</div><div class="gloss" id="gl-${key}">${S.p["g"+key]? esc(S.p["g"+key]) : "Tap a word."}</div>`;
  return `<article class="card"><span class="for">For ${tag(owner)}</span>${c.aloud?`<span class="aloud-tag">${esc(nm(owner))}: read this one aloud to your group</span>`:""}<h4>${esc(c.t)} ${c.y?`<span class="yr">${c.y}</span>`:""}</h4>${he}<p>${esc(c.b)}</p>${c.src?`<p class="muted" style="font-size:.85rem">Source: ${esc(c.src)}</p>`:""}${c.tts?`<button class="say-btn" data-act="speak" data-text="${esc(c.t+". "+c.b)}">Listen</button>`:""}</article>`;
}
const head = st => `<p class="eyebrow">${esc(st.eyebrow)}</p><h2>${esc(st.title)}</h2>${driverLine(st.ch)}`;

/* ================= renderers ================= */
const R = {};
R.setup = () => `
  <div class="field"><span style="font-weight:700">Which mission? <span class="muted" style="font-weight:400">Your teacher will tell you.</span></span>
    <div class="row">${Object.keys(MISSIONS).map(k=>`<button class="btn ${+k===MN?"":"ghost"}" data-act="pickm" data-m="${k}" aria-pressed="${+k===MN}">Mission ${k}: ${esc(MISSIONS[k].title)}</button>`).join("")}</div></div>
  <p class="eyebrow">Mission ${MN} · ${esc(MIS.title)}</p>
  <h2>Who is on this investigation?</h2>
  <p class="lead">Give your group a name, then type the first name of each investigator at this device. You need 2, 3 or 4.</p>
  <div class="field"><label for="team">Group name</label><input id="team" maxlength="24" value="${esc(S.team)}" placeholder="for example: The Modi'in Group"></div>
  <div class="names">${[0,1,2,3].map(i=>`<div class="field"><label for="nm${i}"><span class="dot" style="background:var(--s${i})"></span> Investigator ${i+1}${i>1?" (optional)":""}</label><input id="nm${i}" maxlength="16" value="${esc(S.names[i]||"")}" autocomplete="off"></div>`).join("")}</div>
  <p class="feedback no" id="setupErr" hidden>Enter a group name and at least two investigators.</p>
  <div><button class="btn" data-act="start">Begin the mission</button></div>`;

R.intro = () => `
  <p class="eyebrow">The Archive</p>
  <h2>${esc(S.team)}, look at the big screen</h2>
  <p class="lead">Your teacher will play the opening of the mission on the big screen. Then come back here and meet your roles.</p>
  <div class="feedback info"><b>Seal ${MN} asks:</b> ${esc(MIS.question)}</div>
  <h3>Your roles</h3>
  <div class="roles">${S.names.map((n,i)=>`<div class="role"><b>${tag(i)}</b>${rolesFor(i).map(r=>`<span><b>${r[0]}.</b> <span class="muted">${r[1]}</span></span>`).join("")}</div>`).join("")}</div>
  <h3>How this works</h3>
  <ul style="margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px">
    <li>Every clue is addressed to one of you. Open your own clue, read it, then tell the group what it says.</li>
    <li>Some missions send you around the room. Walk, don't run.</li>
    <li>Before any lock opens, every investigator taps their own seal to say "I agree."</li>
    <li>After each chamber, a runner checks in at Mission Control on the big screen.</li>
    <li>Hints are free. There is no clock and no score.</li>
  </ul>
  <div><button class="btn gold" data-act="next">Enter Chamber 1</button></div>`;

R.evidence = st => {
  const keys = st.cards.map((c,i)=>st.id+"-"+i);
  const allOpen = keys.every(k=>S.opened[k]);
  return `${head(st)}${st.pre?st.pre():""}<p class="lead">${esc(st.lead)}</p>
    <div class="cards">${st.cards.map((c,i)=>cardHTML(c, i+S.step, keys[i])).join("")}</div>
    ${allOpen? `<div><button class="btn gold" data-act="next">${st.id==="c5-storm"?"Read the last line of the seal":"Every note is open. Continue"}</button></div>` : `<p class="muted">Open every note to continue (${keys.filter(k=>S.opened[k]).length} of ${keys.length}).</p>`}`;
};

R.room = st => `${head(st)}${st.body()}<div><button class="btn gold" data-act="next">${esc(st.cta)}</button></div>`;

R.order = st => {
  const seq = S.p.seq || [], pool = st.items.filter(it=>!seq.includes(it[0]));
  const label = id => st.items.find(it=>it[0]===id)[1];
  return `${head(st)}<p class="lead">${esc(st.lead)}</p>
   <div class="slots">${st.items.map((_,i)=>`<div class="slot"><span class="n">${i+1}</span>${seq[i]?`<button class="tile" data-act="unplace" data-id="${seq[i]}" ${S.p.solved?"disabled":""}>${esc(label(seq[i]))}</button>`:`<span class="muted">empty</span>`}</div>`).join("")}</div>
   ${pool.length? `<div class="pool">${pool.map(it=>`<button class="tile" data-act="place" data-id="${it[0]}">${esc(it[1])}</button>`).join("")}</div>`:""}
   ${S.p.fb? `<div class="feedback no">${esc(S.p.fb)}</div>`:""}
   ${S.p.solved? winBlock(st.win) : hintBlock(st.hints) + (seq.length===st.items.length? ritual("Check the timeline") : "")}`;
};

R.lock2 = st => {
  const pi = S.p.part||0;
  const pad = () => `<div class="pad">${["1","2","3","4","5","6","7","8","9","0"].map(d=>`<button data-act="digit" data-d="${d}">${d}</button>`).join("")}</div><div class="row"><button class="btn ghost" data-act="digit" data-d="clear">Clear</button></div>`;
  let h = `${head(st)}`;
  if(pi>0) h += `<div class="feedback ok">Dial 1 clicks into place: ${esc(st.parts[0].a)} years.</div>`;
  if(S.p.solved) return h + winBlock(st.win);
  const part = st.parts[pi], v = S.p.val||"";
  h += `<p class="part">Dial ${pi+1} of 2</p><p class="lead">${esc(part.q.replace(/^Dial \d\. /,""))}</p>
    <div class="lock"><div class="dial" aria-label="Lock number">${esc(v)||"&nbsp;"}</div>${pad()}</div>
    ${S.p.fb?`<div class="feedback no">${esc(S.p.fb)}</div>`:""}${hintBlock(part.hints)}${v.length===part.len? ritual("Turn the dial"):""}`;
  return h;
};

R.choice = st => {
  const pk = S.p.pick, opt = pk? st.options.find(o=>o[0]===pk) : null;
  return `${head(st)}<p class="lead">${esc(st.lead)}</p>
   <div class="choices">${st.options.map(o=>`<button class="choice ${pk===o[0]?"picked":""}" data-act="pick" data-id="${o[0]}" ${S.p.solved?"disabled":""}>${esc(o[1])}</button>`).join("")}</div>
   ${S.p.fb? `<div class="feedback no">${esc(S.p.fb)}</div>`:""}
   ${S.p.solved? winBlock(opt[3]) : hintBlock(st.hints) + (pk? ritual("Lock in this answer"):"")}`;
};

R.sort = st => {
  const pl = S.p.place||{}, sel = S.p.sel, noteKey = st.id+"-note";
  const unplaced = st.items.filter(it=>!pl[it[0]]);
  const placedIn = b => st.items.filter(it=>pl[it[0]]===b[0]).map(it=>`<span class="tile" style="cursor:default">${esc(it[1])}</span>`).join("");
  const binH = b => st.books
    ? `<button class="bin ${sel?"armed":""}" data-act="bin" data-b="${b[0]}" aria-label="Put it in ${esc(b[1])}">${bookSVG(b[1], b[2])}<span class="inbook">${placedIn(b)}</span></button>`
    : `<button class="pbin ${sel?"armed":""}" data-act="bin" data-b="${b[0]}" aria-label="Put it in ${esc(b[1])}"><h4>${esc(b[1])}</h4>${b[2]?`<small>${esc(b[2])}</small>`:""}${placedIn(b)}</button>`;
  return `${head(st)}<p class="lead">${esc(st.lead)}</p>
   ${st.note?`<div class="cards">${cardHTML(st.note, st.note.to, noteKey)}</div>`:""}
   ${(!st.note || S.opened[noteKey])? `
   ${unplaced.length? `<div class="pool">${unplaced.map(it=>`<button class="tile ${sel===it[0]?"sel":""}" data-act="sel" data-id="${it[0]}">${esc(it[1])}</button>`).join("")}</div>`:""}
   ${sel?`<p class="muted">Now tap where it belongs.</p>`:""}
   <div class="bins ${st.books?"":"plain"}">${st.bins.map(binH).join("")}</div>
   ${Object.keys(pl).length && !S.p.solved? `<div><button class="btn ghost" data-act="resetsort">Start the sort again</button></div>`:""}
   ${S.p.fb? `<div class="feedback no">${esc(S.p.fb)}</div>`:""}
   ${S.p.solved? winBlock(st.win) : hintBlock(st.hints) + (!unplaced.length? ritual(st.books?"Check the sources":"Check"):"")}` : `<p class="muted">The archive note must be opened first.</p>`}`;
};

R.map = st => {
  const pl = S.p.place||{}, sel = S.p.sel;
  const where = {greece:"Greece & Macedonia", egypt:"Egypt", israel:"Eretz Yisrael", syria:"Syria", persia:"Bavel & Persia"};
  return `${head(st)}<p class="lead">${esc(st.lead)}</p>
   <div class="pool">${st.labels.map(l=>`<button class="tile ${sel===l[0]?"sel":""}" data-act="sel" data-id="${l[0]}" ${S.p.solved?"disabled":""}>${esc(l[1])}${pl[l[0]]?` <b>→ ${where[pl[l[0]]]}</b>`:""}</button>`).join("")}</div>
   <div class="mapbox">${mapSVG({place:pl, interactive:true})}</div>
   ${Object.keys(pl).length && !S.p.solved? `<div><button class="btn ghost" data-act="resetmap">Clear the map</button></div>`:""}
   ${S.p.fb? `<div class="feedback no">${esc(S.p.fb)}</div>`:""}
   ${S.p.solved? winBlock(st.win) : hintBlock(st.hints) + (Object.keys(pl).length===st.labels.length? ritual("Check the map"):"")}`;
};

R.act = st => {
  const shimon = 0, alex = 1 % N(), narr = N()>2 ? 2 : 0, extra = N()>3 ? 3 : null;
  return `${head(st)}
   ${action(ICON_WALK,"Act it out in the room",`<p>Take the paper torch and the two role signs from the teacher's table. Find a clear space. Read your own lines yourself, out loud.</p>`)}
   <div class="roles">
     <div class="role"><b>${tag(shimon)}</b><span>Shimon HaTzaddik, the Kohen Gadol (holds the torch)</span></div>
     <div class="role"><b>${tag(alex)}</b><span>Alexander, king of Macedonia</span></div>
     <div class="role"><b>${tag(narr)}</b><span>Narrator${narr===shimon?" (also Shimon)":""}</span></div>
     ${extra!==null?`<div class="role"><b>${tag(extra)}</b><span>Alexander's soldier</span></div>`:""}
   </div>
   <div class="script">
     <div class="line speak"><span class="who">${tag(narr)} · Narrator</span>The Kutim told Alexander that the Jews were rebels. Shimon HaTzaddik put on the bigdei kehunah and walked all night to meet him, with leaders carrying torches.</div>
     <div class="line stage">${esc(nm(shimon))} walks slowly across the room holding the torch. ${esc(nm(alex))} waits on the other side.</div>
     ${extra!==null?`<div class="line speak"><span class="who">${tag(extra)} · Soldier</span>Who are these people coming toward us?</div>`:""}
     <div class="line speak"><span class="who">${tag(narr)} · Narrator</span>At dawn, Alexander saw Shimon HaTzaddik. He got down from his chariot and bowed.</div>
     <div class="line stage">${esc(nm(alex))} bows.</div>
     ${extra!==null?`<div class="line speak"><span class="who">${tag(extra)} · Soldier</span>A great king like you bows to this Jew?</div>`:""}
     <div class="line speak"><span class="who">${tag(alex)} · Alexander</span>Before my battles, I see the face of this man leading me to victory.</div>
     <div class="line speak"><span class="who">${tag(narr)} · Narrator</span>The Jews told Alexander the truth about the Kutim, and he did not harm the Beis Hamikdash.</div>
   </div>
   <p class="muted" style="font-size:.9rem">Source: Gemara, Yoma 69a</p>
   <div><button class="btn gold" data-act="next">We acted it out</button></div>`;
};

R.say = st => {
  const who = (driverIndex(st.ch)+1) % N();
  return `<p class="eyebrow">${esc(CHAMBERS[st.ch].n)} · Say it</p><h2>${esc(nm(who))}, you're the explainer</h2>
   ${st.withMap? action(ICON_WALK,"Go to the wall map",`<p>${esc(st.prompt)}</p>`) + `<p class="muted">Here is the same map, in case the wall is busy:</p><div class="mapbox">${mapSVG({})}</div>` : `<p class="lead">${esc(st.prompt)}</p>`}
   <p class="muted">Use your own words. Everyone else listens and helps if something is missing. When the whole group agrees the explanation is right, continue.</p>
   <div><button class="btn gold" data-act="next">We agree</button></div>`;
};

R.hunt = st => {
  const got = S.p.got||0, done = got===st.order.length;
  const who = got % N();
  const prev = got? st.crowns[st.order[got-1]][0] : null;
  const letters = st.order.map(k=>st.crowns[k][1]);
  const pad = ["ש","ה","כ","נ","ו","ח"];
  let h = `${head(st)}<p class="lead">Five crowns are hidden around the room, plus one that doesn't belong. Take turns: each of you brings back one crown's letter, in the order these powers ruled the Yidden.</p>
   <div class="letters" lang="he" aria-label="Letters found">${letters.map((l,i)=>`<span>${i<got?l:""}</span>`).join("")}</div>`;
  if(!done){
    h += action(ICON_WALK,`Crown ${got+1} of 5: ${nm(who)}'s turn`,`<p>${prev? `The last crown was <b>${esc(prev)}</b>. Which power ruled the Yidden right after it?` : "Which power ruled the Yidden first, when the first Beis Hamikdash was destroyed?"} Decide together. Then ${esc(nm(who))} finds that crown in the room, lifts the flap, and comes back with its letter.</p>`)
      + `<p><b>${esc(nm(who))}, tap the letter you found:</b></p><div class="letterpad" lang="he">${pad.map(l=>`<button data-act="letter" data-l="${l}">${l}</button>`).join("")}</div>`
      + (S.p.fb? `<div class="feedback no">${esc(S.p.fb)}</div>`:"") + hintBlock(st.hints);
  } else if(!S.p.solved){
    h += `<div class="feedback info">The letters are complete. Before the seal opens, everyone must agree on the whole order: Bavel, Persia, Alexander, the Ptolemies, the Seleucids.</div>` + ritual("Break the first seal");
  } else {
    h += `<div class="feedback ok">The letters spell חנוכה. The first seal is ready to break.</div><div><button class="btn gold" data-act="next">Break the first seal</button></div>`;
  }
  return h;
};

/* ================= group engine ================= */
let revealTarget = null;
function render(){
  if(IS_CONTROL) return renderControl();
  if(S.step>=STEPS.length) S.step = STEPS.length-1;
  const st = step();
  const hadRitual = !!document.querySelector(".ritual"), hadWin = !!document.querySelector(".feedback.ok");
  $("#stage").innerHTML = R[st.kind](st);
  drawChrome(); save();
  let t = null;
  if(revealTarget){ t = document.querySelector(revealTarget); revealTarget = null; }
  else if(!hadRitual && document.querySelector(".ritual")) t = document.querySelector(".ritual");
  else if(!hadWin && document.querySelector(".feedback.ok")) t = document.querySelector(".feedback.ok");
  else if(document.querySelector(".feedback.no")) t = document.querySelector(".feedback.no");
  if(t){ try{ t.scrollIntoView({block:"nearest"}); }catch(e){} }
}
function advance(){
  if(S.step < STEPS.length-1) S.step++;
  S.p = {}; S.seals = {};
  render();
  try{ window.scrollTo(0,0); }catch(e){}
}
function next(){
  const st = step();
  if(st.satchel) st.satchel.forEach(x=>{ if(!S.satchel.includes(x)) S.satchel.push(x); });
  if(st.id===MIS.sealStep) S.done.seal = true;
  const nx = STEPS[S.step+1];
  const sc = st.out || (nx && nx.enter);
  if(sc) playScene(sc[0], sc[1], advance, sc[2]); else advance();
}
function check(){
  const st = step(); S.seals = {};
  if(st.kind==="order"){
    const right = S.p.seq.filter((id,i)=>id===st.answer[i]).length;
    if(right===st.answer.length){ S.p.solved=true; S.p.fb=null; }
    else S.p.fb = `${right} of ${st.answer.length} events are in the right place. Talk about which ones might be out of order, then try again.`;
  }
  if(st.kind==="lock2"){
    const pi = S.p.part||0, part = st.parts[pi];
    if(S.p.val===part.a){ S.p.fb=null; S.p.val=""; S.p.hint=0; if(pi+1<st.parts.length) S.p.part=pi+1; else S.p.solved=true; }
    else { S.p.fb = (part.special && part.special[S.p.val]) || part.wrong; S.p.val=""; }
  }
  if(st.kind==="choice"){
    const o = st.options.find(x=>x[0]===S.p.pick);
    if(o[2]){ S.p.solved=true; S.p.fb=null; } else { S.p.fb=o[3]; S.p.pick=null; }
  }
  if(st.kind==="sort"){
    const right = st.items.filter(it=>S.p.place[it[0]]===it[2]).length;
    if(right===st.items.length){ S.p.solved=true; S.p.fb=null; }
    else S.p.fb = st.books ? `${right} of ${st.items.length} details are in the right book. Read the archive note again and fix the others.` : `${right} of ${st.items.length} are in the right place. Talk it over and fix the others.`;
  }
  if(st.kind==="map"){
    const right = st.labels.filter(l=>S.p.place[l[0]]===l[2]).length;
    if(right===st.labels.length){ S.p.solved=true; S.p.fb=null; }
    else S.p.fb = `${right} of ${st.labels.length} labels are in the right place. Check the notes about the two kingdoms.`;
  }
  if(st.kind==="hunt" || st.kind==="sealq") S.p.solved = true;
  render();
}
function forceSolve(){
  const st = step();
  if(["order","lock2","choice","sort","map","hunt","sealq"].includes(st.kind) && !S.p.solved){
    if(st.kind==="order") S.p.seq=st.answer.slice();
    if(st.kind==="lock2") S.p.part=st.parts.length-1;
    if(st.kind==="choice") S.p.pick=st.options.find(o=>o[2])[0];
    if(st.kind==="sort"){ if(st.note) S.opened[st.id+"-note"]=true; S.p.place=Object.fromEntries(st.items.map(it=>[it[0],it[2]])); }
    if(st.kind==="map") S.p.place=Object.fromEntries(st.labels.map(l=>[l[0],l[2]]));
    if(st.kind==="hunt") S.p.got=st.order.length;
    S.p.solved=true; S.p.fb=null; render();
  } else if(st.kind==="evidence"){ st.cards.forEach((c,i)=>S.opened[st.id+"-"+i]=true); render(); }
  else next();
}

         <defs><clipPath id="jarclip"><path d="M70 30 H130 V60 C170 80 175 120 170 170 C165 220 140 245 100 245 C60 245 35 220 30 170 C25 120 30 80 70 60 Z"/></clipPath></defs>
         <g clip-path="url(#jarclip)"><rect x="0" y="0" width="200" height="260" fill="var(--panel-2)"/><rect x="0" y="${245 - 215*pct}" width="200" height="${215*pct+20}" fill="var(--gold)"/></g>
         <path d="M70 30 H130 V60 C170 80 175 120 170 170 C165 220 140 245 100 245 C60 245 35 220 30 170 C25 120 30 80 70 60 Z" fill="none" stroke="var(--ink)" stroke-width="4"/>
         <rect x="62" y="18" width="76" height="14" rx="4" fill="var(--stone-2)"/>
       </svg>
       <p style="text-align:center;font-weight:700">${M.oil} of ${jarCap()} drops${pct>=1?" · The jar is full! The whole class did it.":""}</p>
     </div>
   </div>`}`;
}

function playShow(name){
  const slides = SHOWS[name]; let i = 0, timer = null;
  const el = document.createElement("div"); el.className = "show"; el.setAttribute("role","dialog");
  document.body.appendChild(el);
  const draw = () => {
    const s = slides[i];
    el.innerHTML = `<div class="art">${bigArt(s.art, s.art==="question" ? s.n : s.glow, s.open)}</div>
      <p class="cap">${esc(s.cap)}${s.code?`<br><span style="color:#E3B252;letter-spacing:.12em;font-size:1.3em">${GATHER_CODES[s.code]}</span>`:""}</p>
      <div class="ctl"><button class="btn ghost" data-sh="back" ${i===0?"disabled":""}>Back</button>
        <div class="dots">${slides.map((_,k)=>`<i class="${k===i?"on":""}"></i>`).join("")}</div>
        ${i<slides.length-1?`<button class="btn gold" data-sh="next">Next</button>`:`<button class="btn gold" data-sh="close">Done</button>`}</div>`;
    clearTimeout(timer);
    if(name==="intro" && i<slides.length-1) timer = setTimeout(()=>{ i++; draw(); }, 9000);
  };
  el.addEventListener("click", e=>{
    const b = e.target.closest("[data-sh]"); if(!b) return;
    if(b.dataset.sh==="next"){ i=Math.min(i+1,slides.length-1); draw(); }
    if(b.dataset.sh==="back"){ i=Math.max(i-1,0); draw(); }
    if(b.dataset.sh==="close"){ clearTimeout(timer); el.remove(); }
  });
  draw();
}
/* The exported intro video: put it next to the game as intro.mp4 (on GitHub, in the same folder as index.html). */
const INTRO_VIDEO_FILE = "intro.mp4";
const INTRO_VIDEO_PAGE = "https://claude.ai/artifact/FxWBneK76PkunZSzsxh6Wf";
function playVideo(){
  const el = document.createElement("div"); el.className = "show"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Intro video");
  el.innerHTML = `<div class="art"><video id="introVid" src="${INTRO_VIDEO_FILE}" controls autoplay playsinline style="width:min(94vw,1500px);max-height:80vh;background:#000;border-radius:10px"></video>
      <div id="vidMissing" hidden><div style="max-width:46ch;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center">
        <p style="font-size:1.3rem">The intro video file isn't here yet.</p>
        <p class="muted" style="color:#A4AABA">Export the video as an MP4 from its page, name it <b>intro.mp4</b>, and upload it to GitHub in the same place as index.html. Until then, you can open the video's own page.</p>
        <a class="btn gold" href="${INTRO_VIDEO_PAGE}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center">Open the video page</a></div></div></div>
    <div class="ctl"><span></span><button class="btn ghost" data-v="fs">Full screen</button><button class="btn gold" data-v="close">Close</button></div>`;
  document.body.appendChild(el);
  const v = el.querySelector("#introVid");
  v.addEventListener("error", ()=>{ v.hidden = true; el.querySelector("#vidMissing").hidden = false; el.querySelector('[data-v="fs"]').hidden = true; });
  el.addEventListener("click", e=>{
    const b = e.target.closest("[data-v]"); if(!b) return;
    if(b.dataset.v==="close"){ try{ v.pause(); }catch(err){} el.remove(); }
    if(b.dataset.v==="fs"){ try{ (v.requestFullscreen ? v.requestFullscreen() : Promise.reject()).catch(()=>{}); }catch(err){} }
  });
}
function toast(t){ const d=document.createElement("div"); d.className="toast"; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(), 3200); }
function mcErr(t){ const e=$("#mcErr"); if(e){ e.textContent=t; e.hidden=!t; } }
function mcCheckin(){
  const code = ($("#mcCode").value||"").trim().toUpperCase().replace(/[^A-Z]/g,"");
  const ch = MIS.checkin[code];
  if(!ch){ mcErr("That code word doesn't match any chamber. Check the spelling on your tablet."); return; }
  let gi = mcSel;
  if(mcSel==="new"){
    const name = ($("#mcNew").value||"").trim();
    if(!name){ mcErr("Type your group name first."); return; }
    gi = M.groups.findIndex(g=>g.name.toLowerCase()===name.toLowerCase());
    if(gi<0){ M.groups.push({name, done:[]}); gi = M.groups.length-1; }
  }
  const gr = M.groups[gi];
  if(gr.done.includes(ch)){ mcErr(`${gr.name} already checked in for Chamber ${ch}.`); return; }
  gr.done.push(ch); M.oil += 1; mcSel = null; mcSave(); renderControl();
  toast(`${gr.name} opened Chamber ${ch}: ${CHAMBERS[ch].n}. A drop of oil for the class jar!`);
}
function mcCardForm(){
  const gr = M.groups[mcSel];
  $("#mcForm").innerHTML = `<div class="pending"><h3>Crown Card for ${esc(gr.name)}</h3>
    <div class="field"><label for="fk">Kingdom (your teacher tells you which)</label><select id="fk">${KINGDOMS.map(k=>`<option>${esc(k)}</option>`).join("")}</select></div>
    <div class="field"><label for="fh">How it took control</label><input id="fh" maxlength="140"></div>
    <div class="field"><label for="ff">One fact you learned about it</label><input id="ff" maxlength="160"></div>
    <div class="field"><label for="fs">Where the fact comes from (look in your Satchel)</label><input id="fs" maxlength="80"></div>
    <div class="row"><button class="btn gold" data-act="mc-cardsend">Send to the teacher</button></div></div>`;
}

/* ================= events ================= */
document.addEventListener("click", e=>{
  const el = e.target.closest("[data-act]"); if(!el) return;
  if(frozen && !el.closest(".overlay")) return;
  const a = el.dataset.act;
  if(a.startsWith("mc-")) return mcClick(a, el);
  const st = step();
  switch(a){
    case "start": {
      const names = [0,1,2,3].map(i=>$("#nm"+i).value.trim()).filter(Boolean), team = $("#team").value.trim();
      if(names.length<2 || !team){ $("#setupErr").hidden=false; return; }
      S.names = names; S.team = team; next(); break; }
    case "next": next(); break;
    case "switchm": { const m=+el.dataset.m; save(); S = loadGroup(m); store(PICK_KEY, MN); closeLayer(); groupShell(); render(); break; }
    case "pickm": { const m=+el.dataset.m; if(m!==MN){ save(); S = loadGroup(m); store(PICK_KEY, MN); render(); } break; }
    case "open": S.opened[el.dataset.k]=true; render(); break;
    case "speak": speak(el.dataset.text); break;
    case "gloss": {
      const card = el.dataset.k, j=+el.dataset.j;
      const stp = STEPS.find(s=>card.startsWith(s.id+"-")), c = stp.cards[+card.split("-").pop()];
      S.p["g"+card] = `${c.he[j][0]} = ${c.he[j][1]}`;
      const g = document.getElementById("gl-"+card); if(g) g.textContent = S.p["g"+card];
      break; }
    case "hint": S.p.hint=(S.p.hint||0)+1; render(); break;
    case "seal": { const i=+el.dataset.i; S.seals[i]=!S.seals[i]; revealTarget='[data-act="check"]'; render(); break; }
    case "check": check(); break;
    case "place": S.p.seq=(S.p.seq||[]).concat(el.dataset.id); S.seals={}; S.p.fb=null; render(); break;
    case "unplace": S.p.seq=S.p.seq.filter(x=>x!==el.dataset.id); S.seals={}; S.p.fb=null; render(); break;
    case "digit": {
      const d=el.dataset.d, len = st.parts[S.p.part||0].len; S.p.fb=null; S.seals={};
      if(d==="clear") S.p.val=""; else if((S.p.val||"").length<len) S.p.val=(S.p.val||"")+d;
      render(); break; }
    case "pick": S.p.pick=el.dataset.id; S.p.fb=null; S.seals={}; render(); break;
    case "sel": S.p.sel = S.p.sel===el.dataset.id? null : el.dataset.id; render(); break;
    case "bin": if(!S.p.sel) return; S.p.place=Object.assign({},S.p.place,{[S.p.sel]:el.dataset.b}); S.p.sel=null; S.p.fb=null; S.seals={}; render(); break;
    case "resetsort": case "resetmap": S.p.place={}; S.p.sel=null; S.p.fb=null; S.seals={}; render(); break;
    case "region": {
      if(!S.p.sel || S.p.solved) return;
      const pl = Object.assign({}, S.p.place);
      Object.keys(pl).forEach(k=>{ if(pl[k]===el.dataset.r) delete pl[k]; });
      pl[S.p.sel]=el.dataset.r; S.p.place=pl; S.p.sel=null; S.p.fb=null; S.seals={}; render(); break; }
    case "letter": {
      const got=S.p.got||0, want=st.order[got], l=el.dataset.l;
      if(st.crowns[want][1]===l){ S.p.got=got+1; S.p.fb=null; S.p.hint=0; }
      else {
        const k = Object.keys(st.crowns).find(x=>st.crowns[x][1]===l);
        S.p.fb = k==="ROM" ? "That's the crown of Rome. Rome ruled Eretz Yisrael much later, long after the Chanukah story. Try again."
          : `That letter is on the crown of ${st.crowns[k][0]}. ${got? `Who ruled right after ${st.crowns[st.order[got-1]][0]}?` : "Which power ruled first?"} Talk it over and try another crown.`;
      }
      render(); break; }
    case "flip": S.p.flip=Object.assign({},S.p.flip,{[el.dataset.i]:!(S.p.flip||{})[el.dataset.i]}); render(); break;
    case "gcheck": {
      const v = ($("#gcode").value||"").trim().toUpperCase().replace(/[^A-Z]/g,"");
      if(v===GATHER_CODES[st.n]) next(); else { S.p.fb="That's not the code. Wait for your teacher to show it on the big screen."; render(); }
      break; }
    case "exitpick": { const i=S.p.qi||0; S.exitAns[i]=+el.dataset.j; S.p.qi=i+1; render(); break; }
    case "satchel": openSatchel(); break;
    case "teacher": openGate("panel"); break;
    case "close": closeLayer(); break;
    case "gate": tryGate(el.dataset.then); break;
    case "freeze": freeze(); break;
    case "skip": closeLayer(); forceSolve(); break;
    case "goto": { const ch=+el.dataset.ch; const idx=STEPS.findIndex(s=>s.ch===ch && s.kind!=="setup"); if(idx>0){ S.step=idx; S.p={}; S.seals={}; } closeLayer(); render(); break; }
    case "reset-ask": $("#resetConfirm").hidden=false; break;
    case "reset": try{localStorage.removeItem(missionKey(MN));}catch(err){} S=fresh(); closeLayer(); groupShell(); render(); break;
  }
});
function mcClick(a, el){
  switch(a){
    case "mc-sel": mcSel = el.dataset.i==="new" ? "new" : +el.dataset.i; renderControl(); setTimeout(()=>{ const f=$("#mcNew")||$("#mcCode"); if(f) f.focus(); },20); break;
    case "mc-checkin": mcCheckin(); break;
    case "mc-cardform": mcCardForm(); break;
    case "mc-cardsend": {
      const c = {group:M.groups[mcSel].name, kingdom:$("#fk").value, how:$("#fh").value.trim(), fact:$("#ff").value.trim(), src:$("#fs").value.trim(), status:"pending"};
      if(!c.how || !c.fact || !c.src){ mcErr("Fill in all three lines before sending."); return; }
      M.cards.push(c); mcSel=null; mcSave(); renderControl(); toast(`${c.group}'s Crown Card went to the teacher to check.`); break; }
    case "mc-teacher": openGate("mc"); break;
    case "mc-lock": teacherUntil = 0; renderControl(); break;
    case "mc-show": playShow(el.dataset.s); break;
    case "mc-video": playVideo(); break;
    case "mc-view": mcView = el.dataset.v; renderControl(); break;
    case "mc-bonus": openBonus(); break;
    case "mc-bonusdone": M.oil += 2; M.bonusDone++; mcSave(); closeLayer(); renderControl(); toast("Bonus complete: two drops of oil for the class jar!"); break;
    case "mc-bonusother": openBonus(); break;
    case "mc-approve": { const i=+el.dataset.i, c=M.cards[i];
      c.kingdom=$("#ck"+i).value; c.how=$("#ch"+i).value; c.fact=$("#cf"+i).value; c.src=$("#cs"+i).value; c.status="approved";
      mcSave(); renderControl(); toast(`${c.group}'s Crown Card is on the wall.`); break; }
    case "mc-return": { const i=+el.dataset.i; M.cards.splice(i,1); mcSave(); renderControl(); break; }
    case "mc-reset-ask": $("#mcResetConfirm").hidden=false; break;
    case "mc-mission": mcMission = +el.dataset.m; useMission(mcMission); M = mcLoad(mcMission); mcSel=null; mcView="board"; store(MC_PICK, mcMission); renderControl(); break;
    case "mc-reset": M = mcFresh(); mcSave(); mcSel=null; mcView="board"; renderControl(); break;
  }
}
function openBonus(){
  const list = MN===2 ? BONUSES_M2 : BONUSES;
  const b = list[Math.floor(Math.random()*list.length)];
  $("#layer").innerHTML = `<div class="overlay"><div class="sheet" role="dialog" aria-label="Bonus flask" style="max-width:820px">
    <p class="eyebrow">Bonus flask</p><h2 style="font-size:clamp(2rem,4vw,3rem)">${esc(b.t)}</h2><p class="lead" style="font-size:1.5rem">${esc(b.b)}</p>
    <div class="row"><button class="btn gold" data-act="mc-bonusdone">The class did it: add oil</button><button class="btn ghost" data-act="mc-bonusother">Draw another</button><button class="btn ghost" data-act="close">Close</button></div></div></div>`;
}

/* ================= overlays ================= */
function closeLayer(){ $("#layer").innerHTML=""; frozen=false; }
function openSatchel(){
  $("#layer").innerHTML = `<div class="overlay"><div class="sheet" role="dialog" aria-label="Satchel">
    <h3>Evidence Satchel</h3>
    ${S.satchel.length? `<ul style="margin:0;padding-left:1.2em">${S.satchel.map(x=>`<li style="margin-bottom:6px">${esc(x)}</li>`).join("")}</ul>` : `<p class="muted">Nothing collected yet. Evidence goes here as you solve each chamber.</p>`}
    <div><button class="btn" data-act="close">Close</button></div></div></div>`;
}
function openGate(then){
  $("#layer").innerHTML = `<div class="overlay"><div class="sheet" role="dialog" aria-label="Teacher code">
    <h3>Teacher only</h3><p class="muted">Enter the teacher code.</p>
    <div class="keyrow"><input id="tcode" type="password" inputmode="numeric" autocomplete="off" aria-label="Teacher code"><button class="btn" data-act="gate" data-then="${then}">Open</button><button class="btn ghost" data-act="close">Cancel</button></div>
    <p class="feedback no" id="tErr" hidden>That code is not right.</p></div></div>`;
  setTimeout(()=>{ const i=$("#tcode"); if(i) i.focus(); },30);
}
function tryGate(then){
  if($("#tcode").value.trim()!==TEACHER_CODE){ $("#tErr").hidden=false; return; }
  if(then==="unfreeze"){ closeLayer(); return; }
  if(then==="mc"){ teacherUntil = Date.now() + 15*60*1000; closeLayer(); renderControl(); return; }
  openPanel();
}
function openPanel(){
  const st = step();
  $("#layer").innerHTML = `<div class="overlay"><div class="sheet" role="dialog" aria-label="Teacher panel">
    <h3>Teacher panel</h3>
    <p class="muted">Mission ${MN} · Group: ${esc(S.team||"(no name)")} · ${S.names.map(esc).join(", ")||"not started"} · Chamber ${st.ch}: ${esc(CHAMBERS[st.ch].n)} · Step ${S.step+1} of ${STEPS.length}</p>
    <div class="tkey"><b>Answer.</b> ${esc(st.key||"No answer on this screen.")}<br><b>What it teaches.</b> ${esc(st.teaches||"")}</div>
    <div class="row"><button class="btn gold" data-act="freeze">Freeze this screen for discussion</button><button class="btn" data-act="skip">Solve or skip this step</button></div>
    <div><p style="margin-bottom:6px"><b>Jump to a chamber</b></p><div class="row">${CHAMBERS.slice(1).map((c,i)=>`<button class="btn ghost" data-act="goto" data-ch="${i+1}">${i+1}. ${esc(c.n)}</button>`).join("")}</div></div>
    <div><p style="margin-bottom:6px"><b>Switch this tablet to another mission</b></p><div class="row">${Object.keys(MISSIONS).map(k=>`<button class="btn ${+k===MN?"":"ghost"}" data-act="switchm" data-m="${k}">Mission ${k}: ${esc(MISSIONS[k].title)}</button>`).join("")}</div></div>
    <div class="row"><button class="btn ghost" data-act="reset-ask">Reset this device</button><button class="btn ghost" data-act="close">Close</button></div>
    <div id="resetConfirm" class="feedback no" hidden>This erases this group's progress on this device. <button class="btn" data-act="reset" style="margin-left:8px">Yes, reset</button></div>
  </div></div>`;
}
function freeze(){
  frozen = true;
  $("#layer").innerHTML = `<div class="overlay"><div class="sheet freeze" role="dialog" aria-label="Paused"><h2>Eyes on your teacher</h2><p class="lead" style="text-align:center">The scroll is paused for a class discussion.</p>
   <div class="keyrow" style="justify-content:center"><input id="tcode" type="password" inputmode="numeric" autocomplete="off" aria-label="Teacher code to resume"><button class="btn" data-act="gate" data-then="unfreeze">Resume</button></div>
   <p class="feedback no" id="tErr" hidden>That code is not right.</p></div></div>`;
}
document.addEventListener("keydown", e=>{
  if(e.key!=="Enter") return;
  if(e.target.id==="tcode"){ const b=document.querySelector('[data-act="gate"]'); if(b) b.click(); }
  if(e.target.id==="mcCode"||e.target.id==="mcNew"){ const b=document.querySelector('[data-act="mc-checkin"]'); if(b) b.click(); }
  if(e.target.id==="gcode"){ const b=document.querySelector('[data-act="gcheck"]'); if(b) b.click(); }
});
window.addEventListener("hashchange", ()=>location.reload());

if(IS_CONTROL){ document.documentElement.classList.add("big"); useMission(mcMission); renderControl(); } else { groupShell(); render(); }
</script>
